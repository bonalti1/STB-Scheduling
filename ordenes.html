    const text = linesFromItems((await page.getTextContent()).items);
    if (AUDIT_PAGE.test(text)) { skipped++; continue; }
    if (text.replace(/\s/g, '').length >= 80) pages.push({ n, text });
    else { pages.push({ n, image: await pageJpegBase64(page, 1500) }); photos++; }
  }
  if (!pages.length) throw new HttpError(400, 'Nothing readable was found in that PDF.');
  say('Sending ' + pages.length + ' pages to be read' + (photos ? ' (' + photos + ' photographed)' : '') + '… this takes about a minute.');
  let res;
  try {
    res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-stb-token': cfg.token }, body: JSON.stringify({ pages, catalog }) });
  } catch (e) { throw new HttpError(0, 'Could not reach the contract reader. Check the address in Settings and the connection.'); }
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.result) throw new HttpError(res.status, out.error || ('The contract reader answered ' + res.status + '.'));
  out.result.skippedPages = skipped;
  return out.result;
};

// ── Moving the data over from the old desktop tool (one time) ──
// Choose the old STB-Ordenes folder; its houses and photos are copied to the cloud.
window.importOldTool = async function (fileList, progress) {
  const files = Array.from(fileList);
  const byRel = {};
  files.forEach(f => { byRel[(f.webkitRelativePath || f.name).replace(/\\/g, '/')] = f; });
  const jsonRel = Object.keys(byRel).find(k => /(^|\/)data\/orders\.json$/.test(k));
  if (!jsonRel) throw new HttpError(400, 'Choose the STB-Ordenes folder (the one with data/orders.json inside).');
  const root = jsonRel.slice(0, jsonRel.length - 'data/orders.json'.length);
  let old;
  try { old = JSON.parse(await byRel[jsonRel].text()); } catch (e) { throw new HttpError(400, 'orders.json could not be read.'); }
  old.config = old.config || {}; old.projects = Array.isArray(old.projects) ? old.projects : [];

  // Houses that are already in the cloud are skipped, and so are their photos (no re-uploading)
  const have = await readData();
  const isDup = p => have.projects.some(x => x.id === p.id || (x.name === p.name && (x.address || '') === (p.address || '')));
  const fresh = old.projects.filter(p => !isDup(p));
  const refs = new Set();
  (function walk(n) {
    if (typeof n === 'string') { if (n.startsWith('/uploads/')) refs.add(n); }
    else if (Array.isArray(n)) n.forEach(walk);
    else if (n && typeof n === 'object') Object.values(n).forEach(walk);
  })(fresh);

  const list = Array.from(refs), map = {}; let done = 0, missing = 0;
  await pool(list, 4, async url => {
    const f = byRel[root + url.replace(/^\//, '')];
    if (!f) missing++;
    else {
      try {
        let body = f, name = url.replace(/^\/uploads\//, '');
        let type = f.type || (/\.png$/i.test(url) ? 'image/png' : /\.jpe?g$/i.test(url) ? 'image/jpeg' : /\.pdf$/i.test(url) ? 'application/pdf' : 'application/octet-stream');
        if (isImageName(url) && f.size > 300 * 1024) { body = await compressImage(f); type = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
        map[url] = await uploadFile('ordenes/' + name.split('/').map(cleanName).join('/'), body, type);
      } catch (e) { missing++; }
    }
    done++; if (progress) progress(done, list.length);
  });

  // Point every reference at the new cloud address; drop the ones whose file was not in the folder
  const isUp = s => typeof s === 'string' && s.startsWith('/uploads/');
  (function clean(n) {
    if (Array.isArray(n)) {
      for (let i = n.length - 1; i >= 0; i--) {
        if (isUp(n[i])) { if (map[n[i]]) n[i] = map[n[i]]; else n.splice(i, 1); } else clean(n[i]);
      }
    } else if (n && typeof n === 'object') {
      Object.keys(n).forEach(k => { if (isUp(n[k])) n[k] = map[n[k]] || ''; else clean(n[k]); });
    }
  })(fresh);

  const keyHash = old.config.key ? await keyHashOf(String(old.config.key)) : null;   // the key is stored hashed, never as text
  const result = await mutate(data => {
    let added = 0, skipped = 0;
    if (!data.config.keyHash && keyHash) data.config.keyHash = keyHash;
    if (old.config.warnPercent) data.config.warnPercent = Number(old.config.warnPercent) || data.config.warnPercent;
    (old.config.customStores || []).forEach(s => {
      if (!data.config.customStores.some(x => x.id === s.id || String(x.name).toLowerCase() === String(s.name).toLowerCase())) data.config.customStores.push(s);
    });
    old.projects.forEach(p => {
      const dup = data.projects.some(x => x.id === p.id || (x.name === p.name && (x.address || '') === (p.address || '')));
      if (dup) { skipped++; return; }
      p.reportsId = '';            // the old link pointed at the weekly-reports tool; "Sync phases" re-links to the board
      data.projects.push(p); added++;
    });
    return { added, skipped };
  });
  return { ...result, uploaded: list.length - missing, missing };
};

window.downloadOrdersBackup = async function () {
  const d = await readData();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
  a.download = 'stb-orders-backup-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};


// ── The api() the screens call ───────────────────────────────
async function api(url, options) {
  options = options || {};
  const method = (options.method || 'GET').toUpperCase();
  const path = String(url).split('?')[0];
  let body = options.body;
  if (typeof body === 'string') { try { body = JSON.parse(body); } catch (e) { body = {}; } }
  const r = ROUTES.find(x => x.method === method && x.re.test(path));
  if (!r) throw new Error('Unknown request ' + method + ' ' + path);
  const m = path.match(r.re); const params = {};
  r.names.forEach((n, i) => { params[n] = decodeURIComponent(m[i + 1]); });
  try { return await r.fn(params, body || {}); }
  catch (e) { window.toast && window.toast(e.message || 'Something went wrong'); throw e; }
}
window.api = api;

// ── Access gate + start ──────────────────────────────────────
async function currentKeyHash() {
  const d = await readData();
  return d.config.keyHash || await keyHashOf(DEFAULT_KEY);
}
async function gateOk() {
  let saved = ''; try { saved = localStorage.getItem(ACCESS_LS) || ''; } catch (e) {}
  return saved && saved === await currentKeyHash();
}
window.orderGate = async function (e) {
  e.preventDefault();
  const el = document.getElementById('gateKey');
  const h = await keyHashOf(el.value);
  if (h === await currentKeyHash()) {
    try { localStorage.setItem(ACCESS_LS, h); } catch (err) {}
    document.getElementById('gate').style.display = 'none';
    window.load();
  } else {
    document.getElementById('gateErr').style.display = 'block'; el.value = ''; el.focus();
  }
};
window.bootOrders = async function () {
  try {
    if (await gateOk()) { document.getElementById('gate').style.display = 'none'; await window.load(); }
    else { document.getElementById('gate').style.display = 'flex'; document.getElementById('gateKey').focus(); }
  } catch (e) {
    document.getElementById('gateMsg').textContent = '⚠ Could not connect to the cloud. Check the internet and reload.';
    document.getElementById('gateMsg').style.display = 'block';
  }
};
window.orderSignOut = function () { try { localStorage.removeItem(ACCESS_LS); } catch (e) {} location.reload(); };

window.OrdersEngine = { parseText, readData, casSave, mutate, api, uploadFile, compressImage, CATEGORIES, PHASES, keyHashOf };
})();

</script>
<script>
// ── State ────────────────────────────────────────────────────
const S = { catalog: null, data: null, view: 'alerts', houseId: null, reports: [] };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
const catBase = id => (S.catalog.categories.find(c => c.id === id) || { name: id, icon: '📦', phase: 0, leadDays: 21, stores: [], items: [] });
const statusInfo = id => (S.catalog.statuses.find(s => s.id === id) || { name: id, color: 'gray' });
const storeById = id => (S.catalog.stores.find(s => s.id === id) || null);
const house = () => (S.data.projects.find(p => p.id === S.houseId) || null);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2800);
}

const apiJSON = (url, method, body) => api(url, {
  method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
});

// ── Load ─────────────────────────────────────────────────────
async function load() {
  S.catalog = await api('/api/catalog');
  S.data = await api('/api/data');
  try { const r = await api('/api/reports-clients'); S.reports = r.clients || []; } catch (_) { S.reports = []; }
  render();
}

function go(view) { S.view = view; S.houseId = null; render(); window.scrollTo(0, 0); }

function render() {
  ['alerts', 'sequence', 'houses', 'stores'].forEach(v =>
    $('tab-' + v).classList.toggle('on', S.view === v || (v === 'houses' && S.view === 'house')));

  const active = S.data.projects.filter(p => p.active !== false);
  const total = active.reduce((s, p) => s + p.summary.critical + p.summary.urgent, 0);
  $('badge-alerts').textContent = total;
  $('badge-alerts').style.display = total ? '' : 'none';

  if (S.view === 'house' && house()) $('view').innerHTML = viewHouse(house());
  else if (S.view === 'sequence') $('view').innerHTML = viewSequence(active);
  else if (S.view === 'houses') $('view').innerHTML = viewHouses(active);
  else if (S.view === 'stores') $('view').innerHTML = viewStores();
  else $('view').innerHTML = viewAlerts(active);
}

// ── Alerts ───────────────────────────────────────────────────
const ALERT_ICON = { selection: '✋', order: '🛒', delivery: '🚚', budget: '💵' };
const LEVEL_TXT = { critical: 'Critical', urgent: 'Urgent', soon: 'Coming up' };
const LEVEL_CHIP = { critical: 'red', urgent: 'amber', soon: 'blue' };

function viewAlerts(houses) {
  if (!houses.length) return viewNoHouses();

  let critical = 0, urgent = 0, toOrder = 0, over = 0, waiting = 0;
  houses.forEach(p => {
    critical += p.summary.critical; urgent += p.summary.urgent;
    over += p.summary.overTotal; waiting += p.summary.awaitingSelection;
    toOrder += p.summary.pending - p.summary.awaitingSelection;
  });

  let html = '<div class="dash">' +
    card('Critical alerts', critical, 'Deal with these today', critical ? 'c-red' : 'c-green') +
    card('Urgent', urgent, 'The next phase needs them', urgent ? 'c-amber' : 'c-green') +
    card('Still to order', toOrder, 'Picked, not ordered yet', toOrder ? 'c-amber' : 'c-green') +
    card('Waiting on clients', waiting, 'They have not decided', waiting ? 'c-blue' : 'c-green') +
    card('Over allowance', fmt0(over), 'Change order pending', over ? 'c-red' : 'c-green') +
    '</div>';

  const withAlerts = houses.filter(p => p.summary.alerts.length);
  if (!withAlerts.length) {
    return html + '<div class="empty"><div class="em">✅</div>' +
      '<div style="font-size:17px;font-weight:600;color:#2e7d4f">All caught up</div>' +
      '<div style="margin-top:6px">Nothing left to order and no allowance is over.</div></div>';
  }

  withAlerts.sort((a, b) => (b.summary.critical - a.summary.critical) || (b.summary.urgent - a.summary.urgent));

  withAlerts.forEach(p => {
    const worst = p.summary.critical ? 'critical' : (p.summary.urgent ? 'urgent' : 'soon');
    html += '<div class="card n-' + worst + '">' +
      '<div class="house-head" onclick="openHouse(\'' + p.id + '\')">' +
        '<div><div class="house-name">' + esc(p.name) + '</div>' +
        '<div class="house-addr">' + esc(p.address || 'No address') + '</div>' +
        '<div class="chips"><span class="chip blue">' + esc(S.catalog.phases[p.phase] || 'No phase') + '</span>' +
        (p.summary.overTotal ? '<span class="chip red">Over allowance ' + fmt0(p.summary.overTotal) + '</span>' : '') +
        '</div></div>' +
        '<div class="house-nums">' +
          num('Allowance', fmt0(p.summary.allowanceTotal)) +
          num('Spent', fmt0(p.summary.spentTotal)) +
          num('Alerts', p.summary.alerts.length) +
        '</div>' +
      '</div>';

    p.summary.alerts.forEach(a => {
      html += '<div class="alert" onclick="openHouse(\'' + p.id + '\')">' +
        '<div class="alert-icon">' + (ALERT_ICON[a.type] || '•') + '</div>' +
        '<div class="alert-body">' +
          '<div class="alert-title">' + esc(a.title) +
            '<span class="chip ' + LEVEL_CHIP[a.level] + '">' + (LEVEL_TXT[a.level] || a.level) + '</span>' +
            '<span class="chip gray">' + esc(a.categoryName) + '</span></div>' +
          '<div class="alert-detail">' + esc(a.detail) + '</div>' +
          (a.items && a.items.length
            ? '<div class="alert-items">• ' + a.items.map(esc).join('<br>• ') + '</div>' : '') +
        '</div></div>';
    });
    html += '</div>';
  });
  return html;
}

const card = (t, v, d, cls) =>
  '<div class="dash-card ' + (cls || '') + '"><div class="dt">' + t + '</div>' +
  '<div class="dv">' + v + '</div><div class="dd">' + d + '</div></div>';
const num = (t, v) => '<div class="house-num"><div class="t">' + t + '</div><div class="v">' + v + '</div></div>';

function viewNoHouses() {
  return '<div class="empty"><div class="em">🏠</div>' +
    '<div style="font-size:18px;font-weight:600;color:#13233d">No houses yet</div>' +
    '<div style="margin-top:8px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.6">' +
    'Start a house and hand it the client\'s selection package PDF. The tool reads the address, the ' +
    'square footage, what the client picked, the product links and the showroom photos. ' +
    'Allowances are typed in afterwards from the signed contract.</div>' +
    '<div style="margin-top:20px"><button class="btn btn-red" onclick="openNewHouse()">+ New house</button></div></div>';
}

// ── Order sequence ───────────────────────────────────────────
// The buying order the office follows, and which houses are behind on it.
function sequenceRows() {
  const rows = S.catalog.categories.map(cat => ({ rank: cat.orderRank, catId: cat.id, label: cat.name }));
  return rows.sort((a, b) => a.rank - b.rank);
}

// Items that ride on another category's order — the shower heads go out as
// soon as the windows do, without leaving the plumbing allowance.
function followUps(catId) {
  const out = [];
  S.catalog.categories.forEach(cat => {
    (cat.items || []).forEach(i => {
      if (i.triggerAfter === catId) out.push({ category: cat, item: i });
    });
  });
  return out;
}

function viewSequence(houses) {
  let html = '<div class="notice blue">This is the order the office buys things in. ' +
    'Each step shows the houses that still have something to order at that step — ' +
    'red means the house is already at (or past) the phase where it gets installed.</div>';

  if (!houses.length) return html + viewNoHouses();

  sequenceRows().forEach(row => {
    const base = catBase(row.catId);
    const pending = [];
    houses.forEach(p => {
      const cat = (p.categories || []).find(c => c.id === row.catId);
      if (!cat || cat.notApplicable) return;
      const items = (cat.items || []).filter(i =>
        !i.notApplicable && i.status !== 'not-applicable' &&
        ['awaiting-selection', 'ready'].includes(i.status));
      if (!items.length) return;
      const late = p.phase >= (cat.phase != null ? cat.phase : base.phase);
      pending.push({ project: p, items, late });
    });

    const late = pending.some(x => x.late);
    html += '<div class="card ' + (pending.length ? (late ? 'n-critical' : 'n-urgent') : 'n-ok') + '">' +
      '<div class="house-head" style="cursor:default;padding:15px 22px">' +
        '<div style="display:flex;gap:12px;align-items:center">' +
          '<span class="rank">' + row.rank + '</span>' +
          '<div><div class="cat-name">' + base.icon + ' ' + esc(row.label) +
          (base.clientSelects === false ? ' <span class="chip blue">we buy this — no client selection</span>' : '') + '</div>' +
          '<div class="cat-sub">Installed at ' + esc(S.catalog.phases[base.phase]) +
          ' · lead time about ' + base.leadDays + ' days</div></div>' +
        '</div>' +
        '<div class="house-nums">' + num('Houses pending', pending.length) + '</div>' +
      '</div>';

    followUps(row.catId).forEach(f => {
      html += '<div style="padding:11px 22px;font-size:13px;background:#fff8e8;' +
        'border-top:1px solid var(--border);color:var(--amber-text)">↳ <b>As soon as the ' +
        esc(base.name.toLowerCase()) + ' are ordered:</b> order the ' + esc(f.item.name) +
        ' (stays inside the ' + esc(f.category.name) + ' allowance).</div>';
    });

    if (pending.length) {
      html += '<table class="items"><tr><th>House</th><th>Phase now</th><th>Waiting on</th></tr>';
      pending.forEach(x => {
        html += '<tr class="row" onclick="openHouse(\'' + x.project.id + '\')">' +
          '<td class="i-name">' + esc(x.project.name) + '</td>' +
          '<td><span class="chip ' + (x.late ? 'red' : 'blue') + '">' +
            esc(S.catalog.phases[x.project.phase] || '—') + (x.late ? ' · late' : '') + '</span></td>' +
          '<td>' + x.items.map(i =>
            '<span class="chip ' + statusInfo(i.status).color + '">' + esc(i.name) + '</span>').join(' ') +
          '</td></tr>';
      });
      html += '</table>';
    }
    html += '</div>';
  });
  return html;
}

// ── Houses ───────────────────────────────────────────────────
function viewHouses(houses) {
  if (!houses.length) return viewNoHouses();
  let html = '<div class="section-title">Active houses</div>';
  houses.forEach(p => {
    const s = p.summary;
    const worst = s.critical ? 'critical' : (s.urgent ? 'urgent' : (s.pending ? 'soon' : 'ok'));
    html += '<div class="card n-' + worst + '"><div class="house-head" onclick="openHouse(\'' + p.id + '\')">' +
      '<div><div class="house-name">' + esc(p.name) + '</div>' +
      '<div class="house-addr">' + esc(p.address || 'No address') +
        (p.sqft ? ' · ' + p.sqft.toLocaleString('en-US') + ' sqft' : '') + '</div>' +
      '<div class="chips"><span class="chip blue">' + esc(S.catalog.phases[p.phase] || 'No phase') + '</span>' +
        (s.critical ? '<span class="chip red">' + s.critical + ' critical</span>' : '') +
        (s.pending ? '<span class="chip amber">' + s.pending + ' pending</span>' : '<span class="chip green">All ordered</span>') +
      '</div></div>' +
      '<div class="house-nums">' +
        num('Allowance', fmt0(s.allowanceTotal)) +
        num('Spent', fmt0(s.spentTotal)) +
        num('Left', fmt0(s.remainingTotal)) +
        num('Received', s.received + '/' + s.itemsTotal) +
      '</div></div></div>';
  });
  return html;
}

// ── One house ────────────────────────────────────────────────
function openHouse(id) { S.houseId = id; S.view = 'house'; render(); window.scrollTo(0, 0); }

function viewHouse(p) {
  const s = p.summary;
  let html = '<button class="back" onclick="go(\'houses\')">← All houses</button>';

  html += '<div class="card"><div class="house-head" style="cursor:default">' +
    '<div><div class="house-name">' + esc(p.name) + '</div>' +
    '<div class="house-addr">' + esc(p.address || 'No address') +
      (p.sqft ? ' · ' + p.sqft.toLocaleString('en-US') + ' sqft' : '') +
      (p.contractPrice ? ' · contract ' + fmt0(p.contractPrice) : '') +
      (p.client ? ' · ' + esc(p.client) : '') + '</div>' +
    '<div class="chips"><span class="chip blue">' + esc(S.catalog.phases[p.phase] || 'No phase') + '</span>' +
      (p.files && p.files.selections ? '<a class="chip green" href="' + esc(p.files.selections) + '" target="_blank">Selections PDF</a>' : '') +
      (p.files && p.files.contract ? '<a class="chip green" href="' + esc(p.files.contract) + '" target="_blank">Contract PDF</a>' : '') +
    '</div></div>' +
    '<div class="house-nums">' +
      num('Allowance', fmt0(s.allowanceTotal)) +
      num('Spent', fmt0(s.spentTotal)) +
      num('Left', fmt0(s.remainingTotal)) +
    '</div></div>' +
    '<div style="padding:0 24px 18px;display:flex;gap:9px;flex-wrap:wrap">' +
      '<button class="btn-sm" onclick="openEditHouse()">Edit house</button>' +
      '<button class="btn-sm" onclick="openImportSelections()">Load selections PDF</button>' +
      '<button class="btn-sm" onclick="openAllowances()">Set allowances</button>' +
      '<button class="btn-sm" onclick="deleteHouse()">Delete house</button>' +
    '</div></div>';

  html += '<div class="section-title">Categories, in ordering order</div>';
  const cats = (p.categories || []).slice().sort((a, b) =>
    (a.orderRank || catBase(a.id).orderRank || 99) - (b.orderRank || catBase(b.id).orderRank || 99));
  cats.forEach(cat => { html += categoryCard(p, cat); });

  const cos = p.changeOrders || [];
  html += '<div class="section-title">Change orders</div>';
  if (!cos.length) {
    html += '<div class="card" style="padding:18px 24px;color:#667085;font-size:13.5px">' +
      'No change orders yet. When a category goes over its allowance the button to create one shows up there.</div>';
  } else {
    html += '<div class="card" style="border-left-color:var(--red)"><table class="items">' +
      '<tr><th>Date</th><th>Category</th><th>Allowance</th><th>Spent</th><th>To bill</th><th>Status</th><th></th></tr>';
    cos.forEach(co => {
      html += '<tr><td>' + esc(co.date) + '</td><td class="i-name">' + esc(co.categoryName) + '</td>' +
        '<td>' + (co.allowance == null ? '—' : fmt(co.allowance)) + '</td><td>' + fmt(co.spent) + '</td>' +
        '<td class="num" style="color:var(--red)">' + fmt(co.amount) + '</td>' +
        '<td><select class="btn-sm" onchange="setCOStatus(\'' + co.id + '\', this.value)">' +
          [['pending','Pending'],['sent','Sent to Cobros'],['collected','Collected']].map(o =>
            '<option value="' + o[0] + '"' + (co.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
        '</select></td>' +
        '<td>' + (co.cobrosCoId ? '<span class="chip green">In Cobros</span> ' :
          '<button class="btn-sm" onclick="sendCO(\'' + co.id + '\')">Send to Cobros</button> ') +
        '<button class="btn-sm" onclick="copyCO(\'' + co.id + '\')">Copy</button> ' +
        '<button class="btn-sm" onclick="deleteCO(\'' + co.id + '\')">✕</button></td></tr>';
    });
    html += '</table></div>';
  }
  return html;
}

function categoryCard(p, cat) {
  const base = catBase(cat.id);
  const sum = cat.summary;
  const items = cat.items || [];
  const done = items.filter(i => ['received', 'installed'].includes(i.status)).length;
  const rank = cat.orderRank || base.orderRank;

  let budget = '';
  if (cat.notApplicable) {
    budget = '<div class="line muted">Does not apply to this house</div>';
  } else if (sum.allowance === null) {
    budget = '<div class="line muted">No allowance captured</div>' +
             '<div class="line" style="margin-top:3px">Spent <b>' + fmt(sum.spent) + '</b></div>';
  } else {
    const pct = Math.min(100, sum.pct || 0);
    const cls = sum.state === 'over' ? 'over' : (sum.state === 'close' ? 'close' : '');
    const basis = cat.budget.type === 'percent' ? cat.budget.percent + '% of the contract price'
                : cat.budget.type === 'perUnit' ? fmt(cat.budget.rate) + ' × ' + (cat.budget.qty || 0)
                : '';
    budget = '<div class="line"><b>' + fmt(sum.spent) + '</b> of ' + fmt(sum.allowance) +
      (basis ? '<div style="font-size:11px;font-weight:400;color:var(--gray)">' + esc(basis) + '</div>' : '') + '</div>' +
      '<div class="bar"><i class="' + cls + '" style="width:' + pct + '%"></i></div>' +
      '<div class="line muted" style="margin-top:4px;font-size:11.5px">' +
        (sum.state === 'over'
          ? '<span style="color:var(--red)">Over by ' + fmt(sum.over) + '</span>'
          : fmt(sum.remaining) + ' left') + '</div>';
  }

  let html = '<div class="cat-card s-' + sum.state + '">' +
    '<div class="cat-head" onclick="toggleCat(\'' + cat.id + '\')">' +
      '<div class="cat-icon">' + base.icon + '</div>' +
      '<div><div class="cat-name"><span class="rank">' + rank + '</span> ' + esc(base.name) +
        (base.clientSelects === false ? ' <span class="chip blue">we buy this — no client selection</span>' : '') + '</div>' +
        '<div class="cat-sub">Installed at ' + esc(S.catalog.phases[cat.phase] || '—') +
        ' · lead ~' + (base.leadDays || 21) + ' days · ' + done + '/' + items.length + ' received</div></div>' +
      '<div class="cat-budget">' + budget + '</div>' +
    '</div>' +
    '<div id="cat-' + cat.id + '" style="display:none">';

  if (base.note) html += '<div style="padding:11px 20px;font-size:12.5px;color:#667085;background:#f7f9fb;border-top:1px solid var(--border)">ℹ️ ' + esc(base.note) + '</div>';
  if (cat.notes) html += '<div style="padding:11px 20px;font-size:12.5px;color:#48566e;background:#fffdf5;border-top:1px solid var(--border);white-space:pre-wrap">📝 ' + esc(cat.notes) + '</div>';

  const stores = (base.stores || []).map(id => storeById(id)).filter(Boolean);
  if (stores.length) {
    html += '<div style="padding:11px 20px;font-size:12.5px;background:#fbfcfe;border-top:1px solid var(--border)">🏬 <b>Where we buy it:</b> ' +
      stores.map(s => esc(s.name) + (s.firstOption ? ' <span class="chip green">first choice</span>' : '')).join(' · ') + '</div>';
  }

  html += '<table class="items"><tr><th></th><th>Item</th><th>Status</th><th>Allowance</th><th>Spent</th><th>Store / order</th><th>Arrives</th></tr>';
  items.forEach(item => {
    const spent = (item.purchases || []).reduce((s, c) => s + purchaseTotalUI(c), 0);
    const st = statusInfo(item.status);
    let allow = '<span class="muted">—</span>';
    if (item.type === 'sqft') {
      const billable = item.cap ? Math.min(item.sqft || item.cap, item.cap) : item.sqft;
      allow = billable && item.rate
        ? '<span class="num">' + fmt(billable * item.rate) + '</span><div class="i-sel">' +
          billable + ' sqft × ' + fmt(item.rate) +
          (item.cap ? ' (covers ' + item.cap + ' sqft)' : '') + '</div>'
        : '<span style="color:var(--amber-text);font-weight:600">Needs sqft</span>' +
          (item.rate ? '<div class="i-sel">' + fmt(item.rate) + ' / sqft</div>' : '');
    } else if (item.type === 'unit') {
      allow = item.rate && item.qty
        ? '<span class="num">' + fmt(item.rate * item.qty) + '</span><div class="i-sel">' +
          item.qty + ' × ' + fmt(item.rate) + '</div>'
        : '<span style="color:var(--amber-text);font-weight:600">Needs a count</span>';
    } else if (item.type === 'amount' && item.amount) {
      allow = '<span class="num">' + fmt(item.amount) + '</span>';
    } else if (item.type === 'category') {
      allow = '<span class="muted">category total</span>';
    }
    const links = (item.links || []).map((l, i) =>
      '<a href="' + esc(l) + '" target="_blank" onclick="event.stopPropagation()">link ' + (i + 1) + '</a>').join(' · ');
    const thumb = (item.photos || [])[0];

    html += '<tr class="row" onclick="openItem(\'' + cat.id + '\',\'' + item.id + '\')">' +
      '<td>' + (thumb ? '<img class="thumb" src="' + esc(thumb) + '">' : '') + '</td>' +
      '<td><div class="i-name">' + esc(item.name) +
        (item.triggerAfter
          ? ' <span class="chip amber">right after the ' + esc(catBase(item.triggerAfter).name.toLowerCase()) + '</span>'
          : '') + '</div>' +
        (item.selection ? '<div class="i-sel">' + esc(item.selection) + '</div>' : '') +
        (links ? '<div class="i-sel">' + links + '</div>' : '') + '</td>' +
      '<td><span class="chip ' + st.color + '">' + esc(st.name) + '</span></td>' +
      '<td>' + allow + '</td>' +
      '<td>' + (spent ? '<span class="num">' + fmt(spent) + '</span>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (item.store ? esc(item.store) : '<span class="muted">—</span>') +
        (item.orderNo ? '<div class="i-sel">#' + esc(item.orderNo) + '</div>' : '') + '</td>' +
      '<td>' + (item.receivedDate ? '<span style="color:var(--green);font-weight:600">' + esc(item.receivedDate) + '</span>'
              : item.etaDate ? esc(item.etaDate) : '<span class="muted">—</span>') + '</td></tr>';
  });
  html += '</table>';

  if ((cat.photos || []).length) {
    html += '<div class="gallery"><div style="width:100%;font-size:11px;letter-spacing:1px;' +
      'text-transform:uppercase;color:var(--gray);font-weight:700;margin-bottom:2px">' +
      'Photos from the selections PDF — click one to pin it to an item</div>';
    cat.photos.forEach(url => {
      html += '<img src="' + esc(url) + '" onclick="pinPhoto(\'' + cat.id + '\',\'' + esc(url) + '\')">';
    });
    html += '</div>';
  }

  html += '<div style="padding:13px 20px;display:flex;gap:9px;flex-wrap:wrap;border-top:1px solid #f0f2f6">' +
    '<button class="btn-sm" onclick="openNewItem(\'' + cat.id + '\')">+ Add item</button>' +
    '<button class="btn-sm" onclick="openEditCategory(\'' + cat.id + '\')">Edit allowance</button>' +
    '<button class="btn-sm" onclick="setNotApplicable(\'' + cat.id + '\',' + (!cat.notApplicable) + ')">' +
      (cat.notApplicable ? 'It does apply here' : 'Does not apply here') + '</button>' +
    (sum.state === 'over'
      ? '<button class="btn btn-red" style="padding:7px 14px;font-size:12px" onclick="makeCO(\'' + cat.id + '\')">Create change order ' + fmt(sum.over) + '</button>'
      : '') +
    '</div></div></div>';
  return html;
}

function toggleCat(catId) {
  const el = $('cat-' + catId);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ── Modal plumbing ───────────────────────────────────────────
function modal(title, body, foot, wide) {
  $('modal').className = 'modal' + (wide ? ' wide' : '');
  $('modal').innerHTML =
    '<div class="modal-head"><h2 class="oswald">' + title + '</h2>' +
    '<button class="close" onclick="closeModal()">×</button></div>' +
    '<div class="modal-body">' + body + '</div>' +
    (foot ? '<div class="modal-foot">' + foot + '</div>' : '');
  $('modalBg').classList.add('on');
}
function closeModal() { $('modalBg').classList.remove('on'); }
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) closeModal(); });
const val = id => ($(id) ? $(id).value : undefined);

// ── Item ─────────────────────────────────────────────────────
let CUR = null;   // { catId, itemId }

function storeOptions(catId, selected) {
  const base = catBase(catId);
  const suggested = (base.stores || []).map(id => storeById(id)).filter(Boolean);
  const others = S.catalog.stores.filter(s => !suggested.some(x => x.id === s.id));
  const opt = s => '<option value="' + esc(s.name) + '"' + (selected === s.name ? ' selected' : '') + '>' +
    esc(s.name) + (s.firstOption ? ' ★' : '') + '</option>';
  let html = '<option value="">— No store yet —</option>';
  if (suggested.length) html += '<optgroup label="Where we buy this">' + suggested.map(opt).join('') + '</optgroup>';
  html += '<optgroup label="All stores">' + others.map(opt).join('') + '</optgroup>';
  // A store typed straight in stays selectable
  if (selected && !S.catalog.stores.some(s => s.name === selected))
    html += '<option value="' + esc(selected) + '" selected>' + esc(selected) + '</option>';
  return html;
}

// What an allowance line is worth, worked out the same way the server does
function itemAllowanceUI(item) {
  const rate = Number(item.rate) || 0;
  if (item.type === 'sqft') {
    const cap = Number(item.cap) || 0;
    const sqft = Number(item.sqft) || 0;
    if (!rate) return null;
    if (cap) return rate * Math.min(sqft || cap, cap);
    return sqft ? rate * sqft : null;
  }
  if (item.type === 'unit') {
    const qty = Number(item.qty) || 0;
    return rate && qty ? rate * qty : null;
  }
  if (item.type === 'amount') return Number(item.amount) > 0 ? Number(item.amount) : null;
  return null;                                  // shared with the category
}

function openItem(catId, itemId) {
  const p = house();
  const cat = p.categories.find(c => c.id === catId);
  const item = cat.items.find(i => i.id === itemId);
  CUR = { catId, itemId };
  const base = catBase(catId);

  // How this category is bought decides what the purchase form asks for:
  //   invoice / generic → the vendor bills us: no product links
  //   links            → the client picks it online: keep the links
  //   sqft             → bought by the square foot: price per sqft and how many
  const mode = base.tracking || 'generic';
  const showLinks = mode === 'links';
  const bySqft = mode === 'sqft';
  const isInvoice = mode === 'invoice';

  const statusOpts = S.catalog.statuses
    .filter(s => base.clientSelects !== false || s.id !== 'awaiting-selection')
    .map(s => '<option value="' + s.id + '"' + (item.status === s.id ? ' selected' : '') + '>' + s.name + '</option>')
    .join('');

  // The allowance is set on the "Set allowances" sheet, so here it is only shown
  const allowance = itemAllowanceUI(item);
  let allowanceLine;
  if (item.type === 'category') {
    allowanceLine = 'This line shares the <b>' + esc(base.name) + '</b> allowance — nothing of its own.';
  } else if (allowance === null) {
    allowanceLine = 'This line has its own allowance, but the figure is not captured yet.';
  } else {
    allowanceLine = 'Allowance for this line: <b>' + fmt(allowance) + '</b>' +
      (item.type === 'sqft' && item.rate ? ' &nbsp;·&nbsp; ' + fmt(item.rate) + ' / sqft' : '') +
      (item.type === 'unit' && item.rate ? ' &nbsp;·&nbsp; ' + fmt(item.rate) + ' each × ' + (item.qty || 0) : '');
  }
  const allowanceBox = '<div class="notice blue">' + allowanceLine +
    '<br><span style="font-size:12px">Allowances are set on the "Set allowances" sheet for the whole house.</span></div>';

  const purchases = item.purchases || [];
  const spent = purchases.reduce((s, c) => s + purchaseTotalUI(c), 0);

  let purchasesHTML = '<table class="items" style="margin-top:6px">' +
    '<tr><th>Date</th><th>What was bought</th><th>Vendor</th>' +
    (bySqft ? '<th>Sqft</th><th>$ / sqft</th>' : '') +
    '<th>Total</th><th></th></tr>';
  if (!purchases.length) {
    purchasesHTML += '<tr><td colspan="' + (bySqft ? 7 : 5) + '" class="muted" style="padding:14px">' +
      'Nothing recorded yet.</td></tr>';
  } else {
    purchases.forEach(c => {
      purchasesHTML += '<tr><td>' + esc(c.date) + '</td>' +
        '<td>' + esc(c.description || '—') +
          (c.receipt ? ' <a href="' + esc(c.receipt) + '" target="_blank">file</a>' : '') + '</td>' +
        '<td>' + esc(c.store || '—') + '</td>' +
        (bySqft ? '<td>' + (c.sqftBought || '<span class="muted">—</span>') + '</td>' +
                  '<td>' + (c.pricePerSqft ? fmt(c.pricePerSqft) : '<span class="muted">—</span>') + '</td>' : '') +
        '<td class="num">' + fmt(purchaseTotalUI(c)) + '</td>' +
        '<td><button class="btn-sm" onclick="deletePurchase(\'' + c.id + '\')">&times;</button></td></tr>';
    });
    purchasesHTML += '<tr><td colspan="' + (bySqft ? 5 : 3) + '" style="text-align:right;font-weight:700">Total spent</td>' +
      '<td class="num">' + fmt(spent) + '</td><td></td></tr>';
  }
  purchasesHTML += '</table>';

  // Photos pulled from the selections PDF, ready to pin to this line
  let photosHTML = '';
  const gallery = cat.photos || [];
  if (gallery.length) {
    photosHTML = '<div class="section-title" style="margin-top:6px">Photos</div>' +
      '<div class="gallery" style="border:1px solid var(--border);border-radius:11px;background:#fbfcfe">' +
      '<div style="width:100%;font-size:12px;color:var(--gray);margin-bottom:4px">' +
      'Click a photo to pin it to this line (green = pinned).</div>' +
      gallery.map(url => '<img class="' + ((item.photos || []).includes(url) ? 'picked' : '') +
        '" src="' + esc(url) + '" onclick="togglePhoto(\'' + esc(url) + '\', this)">').join('') + '</div>';
  }

  const body =
    '<div class="field"><label>What the client picked</label>' +
      '<textarea id="f-selection">' + esc(item.selection) + '</textarea></div>' +
    (showLinks
      ? '<div class="field"><label>Product links (one per line)</label>' +
        '<textarea id="f-links" placeholder="https://www.homedepot.com/...">' +
        esc((item.links || []).join('\n')) + '</textarea></div>'
      : '') +
    allowanceBox +
    '<div class="row2"><div class="field"><label>Status</label><select id="f-status">' + statusOpts + '</select></div>' +
      '<div class="field"><label>Vendor</label><select id="f-store">' + storeOptions(catId, item.store) + '</select>' +
      '<div style="margin-top:6px"><button class="btn-sm" onclick="openNewStore()">+ Add a vendor</button></div></div></div>' +
    '<div class="row3"><div class="field"><label>Ordered on</label>' +
      '<input type="date" id="f-orderDate" value="' + esc(item.orderDate) + '"></div>' +
      '<div class="field"><label>Expected</label><input type="date" id="f-etaDate" value="' + esc(item.etaDate) + '"></div>' +
      '<div class="field"><label>Received on</label><input type="date" id="f-receivedDate" value="' + esc(item.receivedDate) + '"></div></div>' +
    '<div class="field"><label>Notes</label><textarea id="f-notes">' + esc(item.notes) + '</textarea></div>' +
    photosHTML +

    '<div class="section-title" style="margin-top:8px">' +
      (isInvoice ? 'Vendor invoices' : 'Purchases') + '</div>' + purchasesHTML +

    '<div class="gray-box" style="margin-top:14px">' +
      '<div style="font-weight:700;margin-bottom:11px;font-size:13px">' +
        (isInvoice ? 'Add a vendor invoice' : 'Add a purchase') + '</div>' +
      (isInvoice
        ? '<div class="notice blue" style="margin-bottom:12px">Upload the invoice from ' +
          esc((base.stores || []).map(id => (storeById(id) || {}).name).filter(Boolean).join(' / ')) +
          ' and put the billed total in. The tool checks it against the allowance.</div>'
        : '') +
      (bySqft
        ? '<div class="notice blue" style="margin-bottom:12px">Put in what was actually paid per square ' +
          'foot and how many square feet this house takes of it — the tool multiplies them. These are the ' +
          'sqft of tile, flooring or stone, <b>not</b> the square footage of the house.</div>'
        : '') +

      '<div class="row3"><div class="field"><label>Date ordered</label>' +
        '<input type="date" id="c-date" value="' + today() + '"></div>' +
        '<div class="field"><label>Vendor</label><select id="c-store">' + storeOptions(catId, item.store) + '</select></div>' +
        '<div class="field"><label>' + (isInvoice ? 'Invoice #' : 'Order #') + '</label>' +
          '<input type="text" id="c-orderNo"></div></div>' +

      '<div class="field"><label>What was bought</label>' +
        '<input type="text" id="c-description" placeholder="e.g. 4 matte black ceiling fans"></div>' +

      (bySqft
        ? '<div class="row3"><div class="field"><label>Price paid per sqft</label>' +
            '<input type="number" step="0.01" id="c-persqft" oninput="syncSqftTotal()"></div>' +
          '<div class="field"><label>Sqft this house takes</label>' +
            '<input type="number" step="0.01" id="c-sqft" oninput="syncSqftTotal()"></div>' +
          '<div class="field"><label>Total</label>' +
            '<input type="number" step="0.01" id="c-total"></div></div>'
        : '<div class="field" style="max-width:260px"><label>Total</label>' +
          '<input type="number" step="0.01" id="c-total"></div>') +

      '<div class="field"><label>' + (isInvoice ? 'Invoice file' : 'Receipt') + ' (photo or PDF, optional)</label>' +
        '<input type="file" id="c-receipt" accept="image/*,application/pdf"></div>' +
      '<button class="btn btn-green" onclick="addPurchase(' + (isInvoice ? 'true' : 'false') + ')">' +
        (isInvoice ? 'Add invoice' : 'Add purchase') + '</button></div>';

  modal(esc(item.name) + ' <span style="font-size:13px;color:#8fa0bb;font-family:Inter">· ' + esc(base.name) + '</span>',
    body,
    '<button class="btn-sm" onclick="deleteItem()">Delete line</button>' +
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="saveItem()">Save</button>', true);
}

// Older entries were captured as subtotal + tax + shipping; new ones carry one total
function purchaseTotalUI(c) {
  if (c.total !== undefined && c.total !== null && c.total !== '') return Number(c.total) || 0;
  return (Number(c.subtotal) || 0) + (Number(c.tax) || 0) + (Number(c.shipping) || 0);
}

// Sqft categories: price per sqft × sqft fills the total in
function syncSqftTotal() {
  const rate = Number(val('c-persqft')) || 0;
  const sqft = Number(val('c-sqft')) || 0;
  if (rate && sqft && $('c-total')) $('c-total').value = Math.round(rate * sqft * 100) / 100;
}

let PHOTO_PICK = null;   // photos chosen inside the open modal

function togglePhoto(url, el) {
  const p = house();
  const cat = p.categories.find(c => c.id === CUR.catId);
  const item = cat.items.find(i => i.id === CUR.itemId);
  if (!PHOTO_PICK) PHOTO_PICK = (item.photos || []).slice();
  const i = PHOTO_PICK.indexOf(url);
  if (i === -1) PHOTO_PICK.push(url); else PHOTO_PICK.splice(i, 1);
  el.classList.toggle('picked');
}

async function saveItem() {
  const body = {
    selection: val('f-selection'),
    status: val('f-status'), store: val('f-store'),
    orderDate: val('f-orderDate'), etaDate: val('f-etaDate'), receivedDate: val('f-receivedDate'),
    notes: val('f-notes')
  };
  if ($('f-links')) body.links = (val('f-links') || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (PHOTO_PICK) body.photos = PHOTO_PICK;

  await apiJSON('/api/projects/' + S.houseId + '/categories/' + CUR.catId + '/items/' + CUR.itemId, 'PUT', body);
  PHOTO_PICK = null;
  closeModal(); await load(); openHouse(S.houseId); toast('Saved');
}

async function addPurchase(isInvoice) {
  const total = Number(val('c-total')) || 0;
  if (!total) { toast('Put the total in'); return; }

  let receipt = '';
  const file = $('c-receipt').files[0];
  if (file) {
    const fd = new FormData(); fd.append('receipt', file);
    const up = await api('/api/upload', { method: 'POST', body: fd });
    receipt = up.url;
  }
  await apiJSON('/api/projects/' + S.houseId + '/categories/' + CUR.catId + '/items/' + CUR.itemId + '/purchases', 'POST', {
    date: val('c-date'), description: val('c-description'), store: val('c-store'),
    orderNo: val('c-orderNo'), total, receipt, isInvoice,
    pricePerSqft: val('c-persqft'), sqftBought: val('c-sqft')
  });
  const keep = CUR; PHOTO_PICK = null;
  await load(); openItem(keep.catId, keep.itemId);
  toast(isInvoice ? 'Invoice recorded' : 'Purchase recorded');
}

async function deletePurchase(pid) {
  if (!confirm('Delete this entry?')) return;
  await api('/api/projects/' + S.houseId + '/categories/' + CUR.catId + '/items/' + CUR.itemId + '/purchases/' + pid,
    { method: 'DELETE' });
  const keep = CUR; PHOTO_PICK = null;
  await load(); openItem(keep.catId, keep.itemId);
}

async function deleteItem() {
  if (!confirm('Delete this item and everything recorded on it?')) return;
  await api('/api/projects/' + S.houseId + '/categories/' + CUR.catId + '/items/' + CUR.itemId, { method: 'DELETE' });
  closeModal(); await load(); openHouse(S.houseId); toast('Item deleted');
}

// Pin a gallery photo straight to an item
function pinPhoto(catId, url) {
  const cat = house().categories.find(c => c.id === catId);
  modal('Pin this photo',
    '<div style="text-align:center;margin-bottom:16px"><img src="' + esc(url) +
      '" style="max-width:100%;max-height:340px;border-radius:11px;border:1px solid var(--border)"></div>' +
    '<div class="field"><label>Which item is this?</label><select id="pin-item">' +
      cat.items.map(i => '<option value="' + i.id + '">' + esc(i.name) + '</option>').join('') +
    '</select></div>',
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="doPin(\'' + catId + '\',\'' + esc(url) + '\')">Pin photo</button>');
}

async function doPin(catId, url) {
  const itemId = val('pin-item');
  const cat = house().categories.find(c => c.id === catId);
  const item = cat.items.find(i => i.id === itemId);
  const photos = Array.from(new Set((item.photos || []).concat([url])));
  await apiJSON('/api/projects/' + S.houseId + '/categories/' + catId + '/items/' + itemId, 'PUT', { photos });
  closeModal(); await load(); openHouse(S.houseId); toast('Photo pinned');
}

// ── New item ─────────────────────────────────────────────────
function openNewItem(catId) {
  modal('Add an item to ' + esc(catBase(catId).name),
    '<div class="field"><label>Item name</label>' +
      '<input type="text" id="ni-name" placeholder="e.g. Patio ceiling fan" autofocus></div>' +
    '<div class="field"><label>How is it budgeted?</label><select id="ni-type">' +

// ── The allowance sheet — every figure typed in by hand ──────
// One screen for the whole house, straight off the signed contract.
// The five bases the signed Exhibit A actually uses
const ITEM_BASES = [
  ['category', 'Shared with the category'],
  ['amount',   'Its own amount'],
  ['unit',     '$ each'],
  ['sqft',     '$ per sqft']
];

// The five bases the signed Exhibit A actually uses
const BUDGET_TYPES = [
  ['amount',  'One amount for the whole category'],
  ['percent', 'A % of the contract price'],
  ['perUnit', 'A rate times a count (e.g. $22 per door)'],
  ['perItem', 'No single figure — each line below has its own'],
  ['open',    'Not defined yet']
];

const SHARE_TEXT = {
  amount:  'Everything in this category shares this one amount — whatever is spent on any of it comes out of the same pot.',
  percent: 'Everything in this category shares what that percentage works out to.',
  perUnit: 'Everything in this category shares what that rate times the count works out to.',
  perItem: 'This category has no figure of its own — only the lines listed below.',
  open:    'No allowance captured for this category yet.'
};

// Values live here while the sheet is open, so lines can be added to or
// taken out of the split without losing what has been typed.
let DRAFT = {};

function initDraft(project) {
  DRAFT = {};
  (project.categories || []).forEach(cat => (cat.items || []).forEach(i => {
    const basis = i.type || 'category';
    DRAFT[i.id] = {
      basis,
      value: basis === 'amount' ? (i.amount == null ? '' : i.amount) : (i.rate == null ? '' : i.rate),
      count: basis === 'unit' ? (i.qty == null ? '' : i.qty) : (i.sqft == null ? '' : i.sqft),
      cap: i.cap == null ? '' : i.cap
    };
  }));
}

const draftOf = id => (DRAFT[id] || (DRAFT[id] = { basis: 'category', value: '', count: '', cap: '' }));
function draftSet(id, field, v) { draftOf(id)[field] = v; refreshPercents(); }

// A line is "split out" when the contract gives it its own price
const isSplit = id => draftOf(id).basis !== 'category';
const splitItems = cat => (cat.items || []).filter(i => isSplit(i.id));

// ── Reading the signed contract ──────────────────────────────
let CT = null, CT_HOUSE = null, CT_NA = [];
const normName = t => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');

async function readContract() {
  const file = $('al-contract').files[0];
  if (!file) { toast('Choose the contract PDF above first'); return; }
  const btn = $('ct-btn'), out = $('ct-out');
  btn.disabled = true;
  const say = t => { out.innerHTML = '<div class="notice blue" style="margin-top:12px">' + esc(t) + '</div>'; };
  try {
    const catalog = (house().categories || []).map(cat => {
      const b = catBase(cat.id);
      return { id: cat.id, name: b.name, budgetType: (cat.budget || {}).type || 'open', oneWholeBudget: b.splittable === false,
        items: (cat.items || []).map(i => ({ name: i.name, type: i.type || 'category' })) };
    });
    CT = await readContractPdf(file, catalog, say);
    showContractReview();
  } catch (e) {
    out.innerHTML = '<div class="notice red" style="margin-top:12px">' + esc(e.message || String(e)) +
      '<br>You can still type the allowances in by hand below.</div>';
  } finally { btn.disabled = false; }
}

function describeCat(c, price) {
  const n = v => (v == null || v === '' ? null : Number(v));
  const bits = [];
  if (c.budgetType === 'percent' && n(c.percent)) bits.push(c.percent + '% of the contract price' + (price ? ' = ' + fmt(price * c.percent / 100) : ''));
  else if (c.budgetType === 'amount' && n(c.amount)) bits.push(fmt(c.amount) + ' total');
  else if (c.budgetType === 'perUnit' && n(c.rate)) bits.push(fmt(c.rate) + ' each' + (n(c.qty) ? ' × ' + c.qty : ''));
  else if (c.budgetType === 'perItem') bits.push('priced line by line');
  (c.lines || []).forEach(l => {
    const cap = n(l.cap) ? ' (up to ' + l.cap + ' sqft)' : '';
    const v = l.basis === 'amount' ? fmt(l.amount) : l.basis === 'unit' ? fmt(l.rate) + ' each' + (n(l.qty) ? ' × ' + l.qty : '') : fmt(l.rate) + '/sqft' + (n(l.sqft) ? ' × ' + l.sqft : '') + cap;
    bits.push('<span style="display:block;margin-left:10px">• ' + esc(l.item) + ': ' + v + (l.note ? ' <span class="muted">(' + esc(l.note) + ')</span>' : '') + '</span>');
  });
  return bits.map(b => b.startsWith('<span') ? b : '<span style="display:block">' + b + '</span>').join('') || '<span class="muted">no figure found</span>';
}

function showContractReview() {
  const r = CT, h = r.house || {}, price = Number(h.contractPrice) || 0, p = house();
  const fact = (k, v) => '<tr><td style="color:var(--gray);width:150px">' + k + '</td><td><b>' + (v == null || v === '' ? '<span class="muted">not found</span>' : esc(String(v))) + '</b></td></tr>';
  let html = '<div style="margin-top:14px"><div class="notice blue">This is what was read from the contract. <b>Check it against the paper</b>, then press the button at the bottom. ' +
    'Nothing is saved until you press <b>Save all allowances</b>.</div>' +
    '<table class="items" style="margin-top:10px">' +
      fact('Client', h.client) + fact('Address', h.address) + fact('Living area', h.livingSqft ? h.livingSqft + ' sqft' : null) +
      fact('Total area', h.totalSqft ? h.totalSqft + ' sqft' : null) + fact('Contract price', price ? fmt(price) : null) +
      fact('Deposit', h.deposit ? fmt(h.deposit) : null) + fact('Days to build', h.daysToBuild) + '</table>' +
    '<table class="items" style="margin-top:12px"><tr><th>Category</th><th>What the contract says</th></tr>';
  (r.categories || []).forEach(c => {
    const base = catBase(c.id);
    let body;
    if (c.status === 'priced') {
      body = describeCat(c, price) + (c.needs && c.needs.length ? '<div style="margin-top:4px">' + c.needs.map(x => '<span class="chip" style="background:var(--amber-soft);color:var(--amber-text)">needs: ' + esc(x) + '</span>').join(' ') + '</div>' : '');
    } else {
      const checked = c.status === 'excluded' || c.id === 'garage';
      body = '<span class="muted">' + (c.status === 'excluded' ? 'Not included in this contract.' : 'Not mentioned in this contract.') + '</span>' +
        '<label style="display:block;margin-top:3px;font-size:12.5px"><input type="checkbox" id="ct-na-' + c.id + '"' + (checked ? ' checked' : '') +
        '> Mark “does not apply” for this house</label>';
    }
    body += c.evidence ? '<div class="muted" style="font-size:11.5px;margin-top:3px">“' + esc(c.evidence) + '”</div>' : '';
    html += '<tr><td class="i-name">' + base.icon + ' ' + esc(base.name) + '</td><td>' + body + '</td></tr>';
  });
  html += '</table>';
  if ((r.otherAllowances || []).length) {
    html += '<div class="notice" style="margin-top:12px"><b>Allowances with no place here yet:</b><br>' +
      r.otherAllowances.map(o => '• ' + esc(o.label) + ' — ' + esc(o.detail)).join('<br>') + '</div>';
  }
  if ((r.warnings || []).length) {
    html += '<div class="notice red" style="margin-top:12px"><b>Check these:</b><br>' + r.warnings.map(w => '• ' + esc(w)).join('<br>') + '</div>';
  }
  html += '<div style="margin-top:12px"><button class="btn btn-navy" onclick="applyContract()">Fill the allowances below with this</button></div></div>';
  $('ct-out').innerHTML = html;
}

function applyContract() {
  const r = CT; if (!r) return;
  const h = r.house || {}, p = house();
  if (Number(h.contractPrice)) $('al-price').value = h.contractPrice;
  CT_HOUSE = { client: h.client || '', address: h.address || '', sqft: h.totalSqft || h.livingSqft || '' };
  CT_NA = [];
  (r.categories || []).forEach(c => {
    const cat = (p.categories || []).find(x => x.id === c.id); if (!cat) return;
    const base = catBase(c.id);
    if (c.status !== 'priced') { const na = $('ct-na-' + c.id); if (na && na.checked) CT_NA.push(c.id); return; }
    let type = c.budgetType || 'open';
    if (base.splittable === false && type === 'perItem') type = 'amount';
    const sel = $('al-t-' + c.id);
    if (sel && Array.from(sel.options).some(o => o.value === type)) sel.value = type;
    const set = (id, v) => { const el = $(id); if (el && v != null && v !== '') el.value = v; };
    set('al-a-' + c.id, c.amount); set('al-p-' + c.id, c.percent); set('al-ur-' + c.id, c.rate); set('al-uq-' + c.id, c.qty);
    if (base.splittable !== false) {
      (c.lines || []).forEach(l => {
        const it = (cat.items || []).find(i => normName(i.name) === normName(l.item)); if (!it) return;
        const d = draftOf(it.id); d.basis = l.basis;
        if (l.basis === 'amount') { d.value = l.amount == null ? '' : l.amount; d.count = ''; d.cap = ''; }
        else if (l.basis === 'unit') { d.value = l.rate == null ? '' : l.rate; d.count = l.qty == null ? '' : l.qty; d.cap = ''; }
        else { d.value = l.rate == null ? '' : l.rate; d.count = l.sqft == null ? '' : l.sqft; d.cap = l.cap == null ? '' : l.cap; }
      });
    }
    allowanceRows(c.id);
  });
  refreshPercents();
  $('ct-out').innerHTML = '<div class="notice blue" style="margin-top:12px">✅ Filled in below. Go down the list, compare each figure with the paper contract, ' +
    'add the numbers marked “needs”, then press <b>Save all allowances</b>.' +
    (CT_NA.length ? '<br>' + CT_NA.length + ' categor' + (CT_NA.length === 1 ? 'y' : 'ies') + ' will be marked “does not apply” when you save.' : '') + '</div>';
}

// The lines the contract prices on their own — only those, never the full list
function renderSplit(catId) {
  const box = $('al-split-' + catId);
  if (!box) return;
  const cat = (house().categories || []).find(c => c.id === catId);
  const base = catBase(catId);

  if (!cat || base.splittable === false) { box.innerHTML = ''; return; }

  const split = splitItems(cat);
  const rest = (cat.items || []).filter(i => !isSplit(i.id));

  let html = '';
  if (split.length) {
    html += '<div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);' +
      'font-weight:700;margin:14px 0 6px">Lines the contract prices on their own</div>' +
      '<table class="items"><tr><th>Line</th><th>Basis</th><th>Rate / amount</th>' +
      '<th>How many / sqft</th><th>Covers up to</th><th>Allowance</th><th></th></tr>';

    split.forEach(i => {
      const d = draftOf(i.id);
      const needsCount = d.basis === 'unit' || d.basis === 'sqft';
      html += '<tr><td class="i-name">' + esc(i.name) + '</td>' +
        '<td><select onchange="draftBasis(\'' + catId + '\',\'' + i.id + '\',this.value)">' +
          ITEM_BASES.map(t => '<option value="' + t[0] + '"' + (d.basis === t[0] ? ' selected' : '') + '>' +
            t[1] + '</option>').join('') + '</select></td>' +
        '<td><input type="number" step="0.01" value="' + d.value +
          '" oninput="draftSet(\'' + i.id + '\',\'value\',this.value)" style="width:95px"></td>' +
        '<td>' + (needsCount
          ? '<input type="number" step="0.01" value="' + d.count +
            '" oninput="draftSet(\'' + i.id + '\',\'count\',this.value)" style="width:95px">'
          : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (d.basis === 'sqft'
          ? '<input type="number" step="0.01" value="' + d.cap + '" placeholder="no cap"' +
            ' oninput="draftSet(\'' + i.id + '\',\'cap\',this.value)" style="width:90px">'
          : '<span class="muted">—</span>') + '</td>' +
        '<td class="num" id="al-iv-' + i.id + '"></td>' +
        '<td><button class="btn-sm" onclick="draftBasis(\'' + catId + '\',\'' + i.id + '\',\'category\')"' +
          ' title="Put it back in the shared pot">&times;</button></td></tr>';
    });
    html += '</table>';
  }

  if (rest.length) {
    html += '<div style="margin-top:' + (split.length ? '10px' : '8px') + ';display:flex;gap:8px;' +
      'align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--gray)">' +
      'Does the contract price one of these on its own? ' +
      '<select id="al-add-' + catId + '" style="width:auto;min-width:210px">' +
        rest.map(i => '<option value="' + i.id + '">' + esc(i.name) + '</option>').join('') +
      '</select>' +
      '<button class="btn-sm" onclick="addSplit(\'' + catId + '\')">Give it its own price</button></div>';
  }

  box.innerHTML = html;
  refreshPercents();
}

function draftBasis(catId, itemId, basis) {
  const d = draftOf(itemId);
  d.basis = basis;
  if (basis === 'category') { d.value = ''; d.count = ''; d.cap = ''; }
  renderSplit(catId);
}

function addSplit(catId) {
  const id = val('al-add-' + catId);
  if (!id) return;
  draftOf(id).basis = 'amount';
  renderSplit(catId);
}

// Show only the inputs that matter for the chosen basis
function allowanceRows(catId) {
  const type = val('al-t-' + catId);
  const show = (id, on) => { const el = $(id); if (el) el.style.display = on ? '' : 'none'; };
  show('al-amt-' + catId, type === 'amount');
  show('al-pct-' + catId, type === 'percent');
  show('al-unit-' + catId, type === 'perUnit');

  const text = $('al-sharetext-' + catId);
  if (text) text.textContent = SHARE_TEXT[type] || '';

  renderSplit(catId);
}

// Live math, so every figure can be checked against the contract on screen
function refreshPercents() {
  const price = Number(val('al-price')) || 0;
  (house().categories || []).forEach(cat => {
    const pv = $('al-pv-' + cat.id);
    if (pv) {
      const pct = Number(val('al-p-' + cat.id)) || 0;
      pv.innerHTML = (pct && price) ? fmt(price * pct / 100)
        : '<span style="color:var(--amber-text);font-size:14px">needs both numbers</span>';
    }
    const uv = $('al-uv-' + cat.id);
    if (uv) {
      const rate = Number(val('al-ur-' + cat.id)) || 0;
      const qty = Number(val('al-uq-' + cat.id)) || 0;
      uv.innerHTML = (rate && qty) ? fmt(rate * qty)
        : '<span style="color:var(--amber-text);font-size:14px">needs both numbers</span>';
    }
    (cat.items || []).forEach(i => {
      const cell = $('al-iv-' + i.id);
      if (!cell) return;
      const d = draftOf(i.id);
      const value = Number(d.value) || 0;
      const count = Number(d.count) || 0;
      const cap = Number(d.cap) || 0;
      let total = 0;
      if (d.basis === 'amount') total = value;
      else if (d.basis === 'unit') total = value * count;
      else if (d.basis === 'sqft') total = value * (cap ? Math.min(count || cap, cap) : count);
      cell.innerHTML = total ? fmt(total) : '<span class="muted">—</span>';
    });
  });
}

async function saveAllowances() {
  const p = house();

  const file = $('al-contract').files[0];
  if (file) {
    const fd = new FormData(); fd.append('contract', file);
    const up = await api('/api/upload', { method: 'POST', body: fd });
    await apiJSON('/api/projects/' + S.houseId, 'PUT', { contractUrl: up.url });
  }

  const categories = (p.categories || []).map(cat => ({
    id: cat.id,
    type: val('al-t-' + cat.id),
    amount: val('al-a-' + cat.id),
    percent: val('al-p-' + cat.id),
    rate: val('al-ur-' + cat.id),
    qty: val('al-uq-' + cat.id),
    items: (cat.items || []).map(i => {
      const d = draftOf(i.id);
      const row = { id: i.id, type: d.basis, rate: '', amount: '', sqft: '', qty: '', cap: '' };
      if (d.basis === 'amount') row.amount = d.value;
      if (d.basis === 'unit') { row.rate = d.value; row.qty = d.count; }
      if (d.basis === 'sqft') { row.rate = d.value; row.sqft = d.count; row.cap = d.cap; }
      return row;
    })
  }));

  const r = await apiJSON('/api/projects/' + S.houseId + '/allowances', 'POST', {
    contractPrice: val('al-price'), categories
  });
  if (CT_HOUSE) {                                   // from the contract reader: only fill what is still empty
    const fill = {};
    if (!p.client && CT_HOUSE.client) fill.client = CT_HOUSE.client;
    if (!p.address && CT_HOUSE.address) fill.address = CT_HOUSE.address;
    if (!p.sqft && CT_HOUSE.sqft) fill.sqft = CT_HOUSE.sqft;
    if (Object.keys(fill).length) await apiJSON('/api/projects/' + S.houseId, 'PUT', fill);
  }
  for (const id of CT_NA) await apiJSON('/api/projects/' + S.houseId + '/categories/' + id, 'PUT', { notApplicable: true });
  closeModal(); await load(); openHouse(S.houseId);
  toast('Allowances saved · house total ' + fmt(r.summary.allowanceTotal));
}

// ── Load PDFs into a house that already exists ───────────────
function openImportSelections() {
  WIZ.selections = null;
  modal('Load the selections PDF',
    '<div class="notice blue">Fills in what the client picked, the product links and the showroom photos. ' +
      'Anything already captured by hand is kept.</div>' +
    '<div class="field"><label>Selections PDF</label><input type="file" id="is-pdf" accept="application/pdf"></div>' +
    '<div id="is-result"></div>',
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-red" id="is-btn" onclick="readSelectionsOnly()">Read PDF</button>', true);
}

async function readSelectionsOnly() {
  const file = $('is-pdf').files[0];
  if (!file) { toast('Pick the PDF first'); return; }
  $('is-btn').disabled = true; $('is-btn').textContent = 'Reading...';

  $('is-result').innerHTML = selectionsSummary(WIZ.selections);

  $('is-btn').textContent = 'Apply to this house';
  $('is-btn').setAttribute('onclick', 'applySelections()');
}

async function applySelections() {
  const r = await apiJSON('/api/projects/' + S.houseId + '/apply-selections', 'POST', { selections: WIZ.selections });
  closeModal(); await load(); openHouse(S.houseId);
  toast(r.applied + ' selections loaded');
}


// ── Edit / delete a house ────────────────────────────────────
function openEditHouse() {
  modal('Edit house', houseFields(house()),
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="saveHouse()">Save</button>');
}
async function saveHouse() {
  await apiJSON('/api/projects/' + S.houseId, 'PUT', {
    name: val('h-name'), client: val('h-client'), address: val('h-address'),
    sqft: val('h-sqft'), contractPrice: val('h-price'),
    phase: Number(val('h-phase')), reportsId: val('h-reports') || ''
  });

  await load(); go('houses'); toast('House deleted');
}

// ── Stores ───────────────────────────────────────────────────
function viewStores() {
  const groups = {};
  S.catalog.stores.forEach(s => {
    const g = s.guideCategory || 'Other';
    (groups[g] = groups[g] || []).push(s);
  });

  let html = '<div class="notice blue">These come from the store guide the client receives, plus the ' +
    'vendors the office buys from directly. Add anything else you use with the button below.</div>' +
    '<div style="margin-bottom:18px"><button class="btn btn-red" onclick="openNewStore()">+ Add a store or vendor</button></div>';

  Object.keys(groups).sort().forEach(g => {
    html += '<div class="section-title">' + esc(g) + '</div>';
    groups[g].forEach(s => {
      const cats = (s.categories || []).map(c => catBase(c).name).filter(Boolean);
      html += '<div class="store-card' + (s.firstOption ? ' first' : '') + '">' +
        '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:240px">' +
          '<div class="store-name">' + esc(s.name) +
            (s.firstOption ? ' <span class="chip green">first choice</span>' : '') +
            (s.custom ? ' <span class="chip blue">added by the office</span>' : '') + '</div>' +
          (s.address ? '<div class="store-line">📍 ' + esc(s.address) + '</div>' : '') +
          (s.contact ? '<div class="store-line">📞 ' + esc(s.contact) + '</div>' : '') +
          (s.notes ? '<div class="store-line">' + esc(s.notes) + '</div>' : '') +
          (cats.length ? '<div class="chips">' + cats.map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div>' : '') +
        '</div>' +
        (s.custom ? '<div style="display:flex;gap:7px">' +
          '<button class="btn-sm" onclick="openEditStore(\'' + s.id + '\')">Edit</button>' +
          '<button class="btn-sm" onclick="deleteStore(\'' + s.id + '\')">Delete</button></div>' : '') +
        '</div></div>';
    });
  });
  return html;
}

function storeForm(s) {
  s = s || {};
  return '<div class="field"><label>Store or vendor name</label>' +
      '<input type="text" id="st-name" value="' + esc(s.name || '') + '" autofocus></div>' +
    '<div class="field"><label>Address</label><input type="text" id="st-address" value="' + esc(s.address || '') + '"></div>' +
    '<div class="field"><label>Contact (name, phone, reference)</label>' +
      '<input type="text" id="st-contact" value="' + esc(s.contact || '') + '"></div>' +
    '<div class="field"><label>Notes</label><textarea id="st-notes">' + esc(s.notes || '') + '</textarea></div>' +
    '<div class="field"><label>What do we buy here? (suggests it on those categories)</label>' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px">' +
      S.catalog.categories.map(c =>
        '<label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:#33415c">' +
        '<input type="checkbox" id="st-c-' + c.id + '" style="width:auto"' +
        ((s.categories || []).includes(c.id) ? ' checked' : '') + '> ' + esc(c.name) + '</label>').join('') +
      '</div></div>';
}

function pickedStoreCats() {
  return S.catalog.categories.filter(c => $('st-c-' + c.id) && $('st-c-' + c.id).checked).map(c => c.id);
}

function openNewStore() {
  modal('Add a store or vendor', storeForm(),
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="createStore()">Add</button>');
}
async function createStore() {
  const name = val('st-name');
  if (!name) { toast('Give the store a name'); return; }
  await apiJSON('/api/stores', 'POST', {
    name, address: val('st-address'), contact: val('st-contact'),
    notes: val('st-notes'), categories: pickedStoreCats()
  });
  closeModal(); await load();
  if (S.view === 'house' && S.houseId) openHouse(S.houseId);
  toast('Store added');
}

function openEditStore(id) {
  const s = storeById(id);
  modal('Edit ' + esc(s.name), storeForm(s),
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="saveStore(\'' + id + '\')">Save</button>');
}
async function saveStore(id) {
  await apiJSON('/api/stores/' + id, 'PUT', {
    name: val('st-name'), address: val('st-address'), contact: val('st-contact'),
    notes: val('st-notes'), categories: pickedStoreCats()
  });
  closeModal(); await load(); toast('Store updated');
}
async function deleteStore(id) {
  if (!confirm('Remove this store from the list?')) return;
  await api('/api/stores/' + id, { method: 'DELETE' });
  await load(); toast('Store removed');
}

// ── Phase sync ───────────────────────────────────────────────
async function syncPhases() {
  try {
    const r = await apiJSON('/api/sync-phases', 'POST', {});
    await load();
    const bits = [];
    if (r.changed) bits.push(r.changed + ' house(s) moved phase');
    if (r.linked) bits.push(r.linked + ' linked to the board');
    toast(bits.length ? bits.join(' · ') : 'Every phase was already up to date');
    const notes = [];
    (r.conflicts || []).forEach(c => notes.push('⚠ ' + c));
    if ((r.unmatched || []).length) notes.push('Not found on the scheduling board: ' + r.unmatched.join(', '));
    if (notes.length) modal('Sync phases — please check',
      '<div class="notice blue" style="line-height:1.8">' + notes.map(esc).join('<br>') + '</div>',
      '<button class="btn btn-navy" onclick="closeModal()">OK</button>');
  } catch (_) { /* the message already showed */ }
}

// ── Change orders ────────────────────────────────────────────
async function makeCO(catId) {
  const cat = house().categories.find(c => c.id === catId);
  if (!confirm('Create a change order for ' + fmt(cat.summary.over) + ' on ' + catBase(catId).name + '?')) return;
  await apiJSON('/api/projects/' + S.houseId + '/change-orders', 'POST', {
    category: catId, description: 'Over the allowance on ' + catBase(catId).name
  });
  await load(); openHouse(S.houseId);
  toast('Change order created. Pass it to STB Cobros for signature and billing.');
}
async function setCOStatus(coId, status) {
  await apiJSON('/api/projects/' + S.houseId + '/change-orders/' + coId, 'PUT', { status });
  await load(); openHouse(S.houseId);
}
async function deleteCO(coId) {
  if (!confirm('Delete this change order?')) return;
  await api('/api/projects/' + S.houseId + '/change-orders/' + coId, { method: 'DELETE' });
  await load(); openHouse(S.houseId);
}
function copyCO(coId) {
  const p = house();
  const co = p.changeOrders.find(c => c.id === coId);
  const text =
    'CHANGE ORDER — ' + p.name + '\n' +
    (p.address ? p.address + '\n' : '') +
    'Date: ' + co.date + '\n\n' +
    'Item: ' + co.categoryName + ' above the contract allowance.\n' +
    'Exhibit A allowance: ' + fmt(co.allowance || 0) + '\n' +
    'Actual cost (tax and shipping included): ' + fmt(co.spent) + '\n' +
    'Amount to bill the client: ' + fmt(co.amount);
  navigator.clipboard.writeText(text)
    .then(() => toast('Copied. Or use Send to Cobros'))
    .catch(() => toast('Could not copy'));
}

// ── Settings ─────────────────────────────────────────────────
function openSettings() {
  modal('Settings',
    '<div class="field"><label>Warn when a category reaches this % of its allowance</label>' +
      '<input type="number" id="cf-warn" value="' + (S.data.config.warnPercent || 80) + '" min="1" max="100"></div>' +
    '<div class="field"><label>Change the access key (leave blank to keep it)</label>' +
      '<input type="password" id="cf-key" placeholder="At least 4 characters"></div>' +
    '<div class="notice blue">Construction phases come from the scheduling board. Each house is matched by its number ' +
      '(for example 113) and family name; press <b>Sync phases</b> to update all of them (' + S.reports.length + ' houses on the board).</div>' +
    '<div class="set-sec"><h4>Contract reader (this computer only)</h4>' +
      '<div class="field"><label>Contract key</label><input type="password" id="cf-ct-token" placeholder="' + (contractConfig().token ? 'saved — type to replace' : 'paste the key from Supabase') + '"></div>' +
      '<div class="field"><label>Reader address</label><input type="text" id="cf-ct-url" value="' + esc(contractConfig().url) + '"></div>' +
      '<button class="btn-sm" onclick="saveContractReader()">Save the contract reader</button>' +
      '<div id="ct-saved" style="font-size:12.5px;margin-top:8px">' + (contractConfig().token ? '✅ A contract key is saved on this computer.' : 'No contract key saved on this computer yet.') + '</div></div>' +
    '<div class="set-sec"><h4>Backup</h4>' +
      '<button class="btn-sm" onclick="downloadOrdersBackup()">Download a backup file</button></div>' +
    '<div class="set-sec"><h4>Bring over the old desktop tool</h4>' +
      '<div class="notice blue">One time only. Choose the old <b>STB-Ordenes</b> folder; its houses, allowances, orders and photos are copied to the cloud. ' +
      'Houses already here are skipped.</div>' +
      '<input type="file" id="imp-folder" webkitdirectory multiple>' +
      '<div style="margin-top:10px"><button class="btn-sm" id="imp-btn" onclick="runImport()">Import from the folder</button></div>' +
      '<div id="imp-status"></div></div>',
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="saveSettings()">Save</button>');
}
async function runImport() {
  const input = $('imp-folder');
  if (!input.files.length) { toast('Choose the STB-Ordenes folder first'); return; }
  const st = $('imp-status'); $('imp-btn').disabled = true; st.textContent = 'Reading the folder…';
  try {
    const r = await importOldTool(input.files, (d, t) => { st.textContent = 'Copying photos… ' + d + ' of ' + t; });
    st.innerHTML = '✅ <b>' + r.added + '</b> house(s) added' + (r.skipped ? ' · ' + r.skipped + ' already here' : '') +
      ' · ' + r.uploaded + ' files copied' + (r.missing ? ' · ' + r.missing + ' file(s) were not in the folder' : '');
    await load(); toast('Import finished');
  } catch (e) { st.textContent = '⚠ ' + (e.message || e); }
  finally { $('imp-btn').disabled = false; }
}
async function sendCO(coId) {
  if (!confirm('Send this change order to STB Cobros? It will show up there ready to be signed and billed.')) return;
  try {
    await apiJSON('/api/projects/' + S.houseId + '/change-orders/' + coId + '/send-to-cobros', 'POST', {});
    await load(); openHouse(S.houseId); toast('Sent to Cobros');
  } catch (_) { /* the message already showed */ }
}
// Kept on this computer only (never in the cloud). Checked by reading it back, so a blocked browser shows a clear message.
function saveContractReader() {
  const tok = (val('cf-ct-token') || '').trim(), url = (val('cf-ct-url') || '').trim();
  try {
    if (tok) localStorage.setItem(CONTRACT_TOKEN_LS, tok);
    if (url) localStorage.setItem(CONTRACT_URL_LS, url);
    const back = contractConfig();
    if ((tok && back.token !== tok) || (url && back.url !== url)) throw new Error('read-back mismatch');
  } catch (e) {
    const el = $('ct-saved'); if (el) el.innerHTML = '⚠ This browser would not keep the setting (private window or blocked site data). Use a normal Chrome window.';
    toast('Could not save the contract reader on this computer'); return false;
  }
  const el = $('ct-saved'); if (el) el.innerHTML = '✅ Saved on this computer. A contract key is ' + (contractConfig().token ? 'saved.' : 'NOT saved yet.');
  toast('Contract reader saved on this computer'); return true;
}

async function saveSettings() {
  if ((val('cf-ct-token') || '').trim() || (val('cf-ct-url') || '').trim()) saveContractReader();   // first, so it never depends on the cloud save
  const body = { warnPercent: val('cf-warn') };
  if (val('cf-key')) body.key = val('cf-key');
  await apiJSON('/api/config', 'POST', body);
  closeModal(); await load(); toast('Settings saved');
}
