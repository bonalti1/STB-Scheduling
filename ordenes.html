  (p.categories || []).forEach(cat => allowanceRows(cat.id));
}

// ── Reading the signed contract ──────────────────────────────
let CT = null, CT_HOUSE = null, CT_NA = [];
const normName = t => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');

async function readContract() {
  const file = $('al-contract').files[0];
  if (!file) { toast('Choose the contract PDF above first'); return; }
  const btn = $('ct-btn'), out = $('ct-out');
  btn.disabled = true;
  const say = t => { out.innerHTML = '<div class="notice blue" style="margin-top:12px">' + esc(t) + '</div>'; };
  if (!contractReaderKey()) { btn.disabled = false; askReaderKey(); return; }   // set up right here, no Settings needed
  try {
    const catalog = (house().categories || []).map(cat => {
      const b = catBase(cat.id);
      return { id: cat.id, name: b.name, budgetType: (cat.budget || {}).type || 'open', oneWholeBudget: b.splittable === false,
        items: (cat.items || []).map(i => ({ name: i.name, type: i.type || 'category' })) };
    });
    CT = await readContractPdf(file, catalog, say);
    showContractReview();
  } catch (e) {
    if (e && e.status === 401) { try { localStorage.removeItem(CONTRACT_TOKEN_LS); } catch (_) {} askReaderKey('The key on this computer was not accepted, so it was cleared.'); btn.disabled = false; return; }
    out.innerHTML = '<div class="notice red" style="margin-top:12px">' + esc(e.message || String(e)) +
      '<br>You can still type the allowances in by hand below.</div>';
  } finally { btn.disabled = false; }
}

function describeCat(c, price) {
  const n = v => (v == null || v === '' ? null : Number(v));
  const bits = [];
  if (c.budgetType === 'percent' && n(c.percent)) bits.push(c.percent + '% of the contract price' + (price ? ' = ' + fmt(price * c.percent / 100) : ''));
  else if (c.budgetType === 'amount' && n(c.amount)) bits.push(fmt(c.amount) + ' total');
  else if (c.budgetType === 'perUnit' && n(c.rate)) bits.push(fmt(c.rate) + ' each' + (n(c.qty) ? ' × ' + c.qty : ''));
  else if (c.budgetType === 'perItem') bits.push('priced line by line');
  (c.lines || []).forEach(l => {
    const cap = n(l.cap) ? ' (up to ' + l.cap + ' sqft)' : '';
    const v = l.basis === 'amount' ? fmt(l.amount) : l.basis === 'unit' ? fmt(l.rate) + ' each' + (n(l.qty) ? ' × ' + l.qty : '') : fmt(l.rate) + '/sqft' + (n(l.sqft) ? ' × ' + l.sqft : '') + cap;
    bits.push('<span style="display:block;margin-left:10px">• ' + esc(l.item) + ': ' + v + (l.note ? ' <span class="muted">(' + esc(l.note) + ')</span>' : '') + '</span>');
  });
  return bits.map(b => b.startsWith('<span') ? b : '<span style="display:block">' + b + '</span>').join('') || '<span class="muted">no figure found</span>';
}

function showContractReview() {
  const r = CT, h = r.house || {}, price = Number(h.contractPrice) || 0, p = house();
  const fact = (k, v) => '<tr><td style="color:var(--gray);width:150px">' + k + '</td><td><b>' + (v == null || v === '' ? '<span class="muted">not found</span>' : esc(String(v))) + '</b></td></tr>';
  let html = '<div style="margin-top:14px"><div class="notice blue">This is what was read from the contract. <b>Check it against the paper</b>, then press the button at the bottom. ' +
    'Nothing is saved until you press <b>Save all allowances</b>.</div>' +
    '<table class="items" style="margin-top:10px">' +
      fact('Client', h.client) + fact('Address', h.address) + fact('Living area', h.livingSqft ? h.livingSqft + ' sqft' : null) +
      fact('Total area', h.totalSqft ? h.totalSqft + ' sqft' : null) + fact('Contract price', price ? fmt(price) : null) +
      fact('Deposit', h.deposit ? fmt(h.deposit) : null) + fact('Days to build', h.daysToBuild) + '</table>' +
    '<table class="items" style="margin-top:12px"><tr><th>Category</th><th>What the contract says</th></tr>';
  (r.categories || []).forEach(c => {
    const base = catBase(c.id);
    let body;
    if (c.status === 'priced') {
      body = describeCat(c, price) + (c.needs && c.needs.length ? '<div style="margin-top:4px">' + c.needs.map(x => '<span class="chip" style="background:var(--amber-soft);color:var(--amber-text)">needs: ' + esc(x) + '</span>').join(' ') + '</div>' : '');
    } else {
      const checked = c.status === 'excluded' || c.id === 'garage';
      body = '<span class="muted">' + (c.status === 'excluded' ? 'Not included in this contract.' : 'Not mentioned in this contract.') + '</span>' +
        '<label style="display:block;margin-top:3px;font-size:12.5px"><input type="checkbox" id="ct-na-' + c.id + '"' + (checked ? ' checked' : '') +
        '> Mark “does not apply” for this house</label>';
    }
    body += c.evidence ? '<div class="muted" style="font-size:11.5px;margin-top:3px">“' + esc(c.evidence) + '”</div>' : '';
    html += '<tr><td class="i-name">' + base.icon + ' ' + esc(base.name) + '</td><td>' + body + '</td></tr>';
  });
  html += '</table>';
  if ((r.otherAllowances || []).length) {
    html += '<div class="notice" style="margin-top:12px"><b>Allowances with no place here yet:</b><br>' +
      r.otherAllowances.map(o => '• ' + esc(o.label) + ' — ' + esc(o.detail)).join('<br>') + '</div>';
  }
  if ((r.warnings || []).length) {
    html += '<div class="notice red" style="margin-top:12px"><b>Check these:</b><br>' + r.warnings.map(w => '• ' + esc(w)).join('<br>') + '</div>';
  }
  html += '<div style="margin-top:12px"><button class="btn btn-navy" onclick="applyContract()">Fill the allowances below with this</button></div></div>';
  $('ct-out').innerHTML = html;
}

function applyContract() {
  const r = CT; if (!r) return;
  const h = r.house || {}, p = house();
  if (Number(h.contractPrice)) $('al-price').value = h.contractPrice;
  CT_HOUSE = { client: h.client || '', address: h.address || '', sqft: h.totalSqft || h.livingSqft || '' };
  CT_NA = [];
  (r.categories || []).forEach(c => {
    const cat = (p.categories || []).find(x => x.id === c.id); if (!cat) return;
    const base = catBase(c.id);
    if (c.status !== 'priced') { const na = $('ct-na-' + c.id); if (na && na.checked) CT_NA.push(c.id); return; }
    let type = c.budgetType || 'open';
    if (base.splittable === false && type === 'perItem') type = 'amount';
    const sel = $('al-t-' + c.id);
    if (sel && Array.from(sel.options).some(o => o.value === type)) sel.value = type;
    const set = (id, v) => { const el = $(id); if (el && v != null && v !== '') el.value = v; };
    set('al-a-' + c.id, c.amount); set('al-p-' + c.id, c.percent); set('al-ur-' + c.id, c.rate); set('al-uq-' + c.id, c.qty);
    if (base.splittable !== false) {
      (c.lines || []).forEach(l => {
        const it = (cat.items || []).find(i => normName(i.name) === normName(l.item)); if (!it) return;
        const d = draftOf(it.id); d.basis = l.basis;
        if (l.basis === 'amount') { d.value = l.amount == null ? '' : l.amount; d.count = ''; d.cap = ''; }
        else if (l.basis === 'unit') { d.value = l.rate == null ? '' : l.rate; d.count = l.qty != null ? l.qty : (it.needQty != null ? it.needQty : ''); d.cap = ''; }   // the count the contract does not give can come from the house plan
        else { d.value = l.rate == null ? '' : l.rate; d.count = l.sqft == null ? '' : l.sqft; d.cap = l.cap == null ? '' : l.cap; }
      });
    }
    allowanceRows(c.id);
  });
  refreshPercents();
  $('ct-out').innerHTML = '<div class="notice blue" style="margin-top:12px">✅ Filled in below. Go down the list, compare each figure with the paper contract, ' +
    'add the numbers marked “needs”, then press <b>Save all allowances</b>.' +
    (CT_NA.length ? '<br>' + CT_NA.length + ' categor' + (CT_NA.length === 1 ? 'y' : 'ies') + ' will be marked “does not apply” when you save.' : '') + '</div>';
}


// The key lives on each computer. If this one has none yet, ask for it right where it is needed.
function contractReaderKey() { try { return localStorage.getItem(CONTRACT_TOKEN_LS) || ''; } catch (e) { return ''; } }
function askReaderKey(why) {
  $('ct-out').innerHTML = '<div class="notice' + (why ? ' red' : '') + '" style="margin-top:12px"><b>' + (why ? esc(why) + ' Paste the key again.' : 'This computer does not have the contract key yet.') + '</b><br>' +
    (why ? 'Check it character by character: the number 0 and the letter O look alike, and so do l, 1 and I. Copying and pasting the message is safest. ' : 'Paste it once here (ask Rolando if you do not have it) and the contract is read right away.') +
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input type="password" id="ct-key-in" placeholder="Contract key" style="flex:1;min-width:200px">' +
    '<button class="btn btn-navy" onclick="saveReaderKeyHere()">Save and read the contract</button></div></div>';
  const el = $('ct-key-in'); if (el) el.focus();
}
function saveReaderKeyHere() {
  const k = (val('ct-key-in') || '').trim();
  if (!k) { toast('Paste the key first'); return; }
  try { localStorage.setItem(CONTRACT_TOKEN_LS, k); } catch (e) {}
  if (!contractReaderKey()) { $('ct-out').innerHTML = '<div class="notice red" style="margin-top:12px">⚠ This browser would not keep the key (private window?). Use a normal Chrome window.</div>'; return; }
  testReaderKey().then(r => {
    if (r === 'bad') { try { localStorage.removeItem(CONTRACT_TOKEN_LS); } catch (e) {} askReaderKey('That key was not accepted.'); }
    else readContract();
  });
}
// Asks the reader with nothing to read: the key is checked first (401 = wrong key, 400 = key accepted)
async function testReaderKey() {
  const cfg = contractConfig();
  try {
    const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-stb-token': cfg.token }, body: '{}' });
    return r.status === 401 ? 'bad' : 'ok';
  } catch (e) { return 'offline'; }
}

// The lines the contract prices on their own — only those, never the full list
function renderSplit(catId) {
  const box = $('al-split-' + catId);
  if (!box) return;
  const cat = (house().categories || []).find(c => c.id === catId);
  const base = catBase(catId);

  if (!cat || base.splittable === false) { box.innerHTML = ''; return; }

  const split = splitItems(cat);
  const rest = (cat.items || []).filter(i => !isSplit(i.id));

  let html = '';
  if (split.length) {
    html += '<div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);' +
      'font-weight:700;margin:14px 0 6px">Lines the contract prices on their own</div>' +
      '<table class="items"><tr><th>Line</th><th>Basis</th><th>Rate / amount</th>' +
      '<th>How many / sqft</th><th>Covers up to</th><th>Allowance</th><th></th></tr>';

    split.forEach(i => {
      const d = draftOf(i.id);
      const needsCount = d.basis === 'unit' || d.basis === 'sqft';
      html += '<tr><td class="i-name">' + esc(i.name) + '</td>' +
        '<td><select onchange="draftBasis(\'' + catId + '\',\'' + i.id + '\',this.value)">' +
          ITEM_BASES.map(t => '<option value="' + t[0] + '"' + (d.basis === t[0] ? ' selected' : '') + '>' +
            t[1] + '</option>').join('') + '</select></td>' +
        '<td><input type="number" step="0.01" value="' + d.value +
          '" oninput="draftSet(\'' + i.id + '\',\'value\',this.value)" style="width:95px"></td>' +
        '<td>' + (needsCount
          ? '<input type="number" step="0.01" value="' + d.count +
            '" oninput="draftSet(\'' + i.id + '\',\'count\',this.value)" style="width:95px">'
          : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (d.basis === 'sqft'
          ? '<input type="number" step="0.01" value="' + d.cap + '" placeholder="no cap"' +
            ' oninput="draftSet(\'' + i.id + '\',\'cap\',this.value)" style="width:90px">'
          : '<span class="muted">—</span>') + '</td>' +
        '<td class="num" id="al-iv-' + i.id + '"></td>' +
        '<td><button class="btn-sm" onclick="draftBasis(\'' + catId + '\',\'' + i.id + '\',\'category\')"' +
          ' title="Put it back in the shared pot">&times;</button></td></tr>';
    });
    html += '</table>';
  }

  if (rest.length) {
    html += '<div style="margin-top:' + (split.length ? '10px' : '8px') + ';display:flex;gap:8px;' +
      'align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--gray)">' +
      'Does the contract price one of these on its own? ' +
      '<select id="al-add-' + catId + '" style="width:auto;min-width:210px">' +
        rest.map(i => '<option value="' + i.id + '">' + esc(i.name) + '</option>').join('') +
      '</select>' +
      '<button class="btn-sm" onclick="addSplit(\'' + catId + '\')">Give it its own price</button></div>';
  }

  box.innerHTML = html;
  refreshPercents();
}

function draftBasis(catId, itemId, basis) {
  const d = draftOf(itemId);
  d.basis = basis;
  if (basis === 'category') { d.value = ''; d.count = ''; d.cap = ''; }
  renderSplit(catId);
}

function addSplit(catId) {
  const id = val('al-add-' + catId);
  if (!id) return;
  draftOf(id).basis = 'amount';
  renderSplit(catId);
}

// Show only the inputs that matter for the chosen basis
function allowanceRows(catId) {
  const type = val('al-t-' + catId);
  const show = (id, on) => { const el = $(id); if (el) el.style.display = on ? '' : 'none'; };

// Live math, so every figure can be checked against the contract on screen
function refreshPercents() {
  const price = Number(val('al-price')) || 0;
  (house().categories || []).forEach(cat => {
    const pv = $('al-pv-' + cat.id);
    if (pv) {
      const pct = Number(val('al-p-' + cat.id)) || 0;
      pv.innerHTML = (pct && price) ? fmt(price * pct / 100)
        : '<span style="color:var(--amber-text);font-size:14px">needs both numbers</span>';
    }
    const uv = $('al-uv-' + cat.id);
    if (uv) {
      const rate = Number(val('al-ur-' + cat.id)) || 0;
      const qty = Number(val('al-uq-' + cat.id)) || 0;
      uv.innerHTML = (rate && qty) ? fmt(rate * qty)
        : '<span style="color:var(--amber-text);font-size:14px">needs both numbers</span>';
    }
    (cat.items || []).forEach(i => {
      const cell = $('al-iv-' + i.id);
      if (!cell) return;
      const d = draftOf(i.id);
      const value = Number(d.value) || 0;
      const count = Number(d.count) || 0;
      const cap = Number(d.cap) || 0;
      let total = 0;
      if (d.basis === 'amount') total = value;
      else if (d.basis === 'unit') total = value * count;
      else if (d.basis === 'sqft') total = value * (cap ? Math.min(count || cap, cap) : count);
      cell.innerHTML = total ? fmt(total) : '<span class="muted">—</span>';
    });
  });
}

async function saveAllowances() {
  const p = house();

  const file = $('al-contract').files[0];
  if (file) {
    const fd = new FormData(); fd.append('contract', file);
    const up = await api('/api/upload', { method: 'POST', body: fd });
    await apiJSON('/api/projects/' + S.houseId, 'PUT', { contractUrl: up.url });
  }

  const categories = (p.categories || []).map(cat => ({
    id: cat.id,
    type: val('al-t-' + cat.id),
    amount: val('al-a-' + cat.id),
    percent: val('al-p-' + cat.id),
    rate: val('al-ur-' + cat.id),
    qty: val('al-uq-' + cat.id),
    items: (cat.items || []).map(i => {
      const d = draftOf(i.id);
      const row = { id: i.id, type: d.basis, rate: '', amount: '', sqft: '', qty: '', cap: '' };
      if (d.basis === 'amount') row.amount = d.value;
      if (d.basis === 'unit') { row.rate = d.value; row.qty = d.count; }
      if (d.basis === 'sqft') { row.rate = d.value; row.sqft = d.count; row.cap = d.cap; }

  }));

  if ($('pl-counts')) await savePlanCounts(true);

// ── Settings ─────────────────────────────────────────────────
// ── Board: every house against every category, like the office sheet ──
// ✓ all received · Ordered · Partly (some ordered) · Pending (picked, not
// ordered) · No pick (client has not chosen) · NA. Red = the house is
// already at the phase that needs it and it is not all ordered. $ = over allowance.
function boardCell(p, cat) {
  const base = catBase(cat.id);
  if (cat.notApplicable) return { cls: 'b-na', txt: 'NA' };
  const items = (cat.items || []).filter(i => !i.notApplicable && i.status !== 'not-applicable');
  if (!items.length) return { cls: 'b-na', txt: 'NA' };
  const n = st => items.filter(i => st.includes(i.status)).length;
  const done = n(['received', 'installed']);
  const moving = n(['ordered', 'in-transit']);
  const ready = n(['ready']);
  const total = items.length;
  let cls, txt;
  if (done === total) {
    const onSite = base.driverDelivers && items.every(i => (i.delivery || {}).stage === 'delivered' || i.status === 'installed');
    cls = 'b-done'; txt = onSite ? 'On site' : '✓';
  } else if (done + moving === total) { cls = 'b-ordered'; txt = 'Ordered'; }
  else if (done + moving > 0) { cls = 'b-partial'; txt = (done + moving) + '/' + total; }
  else if (ready) { cls = 'b-pending'; txt = 'Pending'; }
  else { cls = 'b-waiting'; txt = 'No pick'; }
  const catPhase = cat.phase != null ? cat.phase : base.phase;
  const late = Number.isInteger(p.phase) && p.phase >= catPhase && done + moving < total;
  if (late) { cls += ' b-urgent'; if (txt === 'Pending' || txt === 'No pick') txt = 'URGENT · ' + txt; }
  if (cat.summary && cat.summary.state === 'over') cls += ' b-over';
  return { cls, txt };
}

function viewBoard(houses) {
  const rows = sequenceRows();
  let html = '<div class="section-title">Board</div>' +
    '<div class="legend"><span><b class="b-done">✓</b> all in</span><span><b class="b-ordered">Ordered</b></span>' +
    '<span><b class="b-partial">3/8</b> partly ordered</span><span><b class="b-pending">Pending</b> picked, not ordered</span>' +
    '<span><b class="b-waiting">No pick</b> client has not chosen</span><span><b class="b-urgent">red</b> the house is at that phase already</span>' +
    '<span><b style="color:var(--red)">$</b> over allowance</span><span>Click a box to open it</span></div>';
  html += '<div class="board-wrap"><table class="board"><thead><tr><th class="ph">Phase</th><th class="ph" style="text-align:left">What</th>' +
    houses.map(p => '<th onclick="openHouse(\'' + p.id + '\')" title="' + esc(S.catalog.phases[p.phase] || 'No phase') + '">' +
      esc(p.name.replace(/\s*\(\d+\)\s*$/, '')) +
      '<div style="font-family:Inter;font-size:10px;font-weight:400;color:#8fa0bb">' + esc(S.catalog.phases[p.phase] || '—') + '</div></th>').join('') +
    '</tr></thead><tbody>';
  // group the steps by the phase they get installed at, in buying order
  let lastPhase = null;
  const spans = {};
  rows.forEach(r => { const ph = catBase(r.catId).phase; spans[ph] = (spans[ph] || 0) + 1; });
  const ordered = rows.slice().sort((a, b) => (catBase(a.catId).phase - catBase(b.catId).phase) || (a.rank - b.rank));
  ordered.forEach(r => {
    const base = catBase(r.catId);
    html += '<tr>';
    if (base.phase !== lastPhase) {
      html += '<td class="phase" rowspan="' + spans[base.phase] + '">' + esc(S.catalog.phases[base.phase] || '') + '</td>';
      lastPhase = base.phase;
    }
    html += '<td class="cat">' + base.icon + ' ' + esc(base.name) + '</td>';
    houses.forEach(p => {
      const cat = (p.categories || []).find(c => c.id === r.catId);
      if (!cat) { html += '<td></td>'; return; }
      const c = boardCell(p, cat);
      html += '<td class="cell ' + c.cls + '" onclick="openHouseAt(\'' + p.id + '\',\'' + cat.id + '\')">' + esc(c.txt) + '</td>';
    });
    html += '</tr>';
  });
  return html + '</tbody></table></div>';
}

// Same split the server does, shown before saving
function orderPreview() {
  const lines = orderPicked();
  const total = Number(val('o-total')) || 0;
  const box = $('o-preview');
  if (!lines.length) { box.innerHTML = 'Tick the lines in this order.'; return; }
  const priced = lines.filter(l => l.price > 0);
  if (priced.length && priced.length < lines.length) {
    box.innerHTML = '<span style="color:var(--red);font-weight:600">Put the price before tax on every ticked line, or leave all of them empty.</span>';
    return;
  }
  if (!total) { box.innerHTML = lines.length + ' line(s) ticked — now put the total paid.'; return; }
  const sum = priced.reduce((s, l) => s + l.price, 0);
  const extra = priced.length ? total - sum : null;
  box.innerHTML = '<b>How the ' + fmt(total) + ' is split:</b>' +
    (priced.length ? ' <span class="muted">(tax + shipping ' + fmt(extra) + ' = ' + (sum ? (extra / sum * 100).toFixed(1) : 0) + '% on each line)</span>' : ' <span class="muted">(evenly)</span>') +
    '<table class="items" style="margin-top:6px">' + lines.map(l => {
      const share = priced.length ? total * l.price / sum : total / lines.length;
      return '<tr><td>' + esc(l.name) + (l.pieces ? ' ×' + esc(l.pieces) : '') + '</td><td class="num" style="text-align:right">' + fmt(share) +
        (l.pieces ? '<div class="i-sel">' + fmt(share / l.pieces) + ' each</div>' : '') + '</td></tr>';
    }).join('') + '</table>';
}

  if (file) {
    const fd = new FormData(); fd.append('receipt', file);
    const up = await api('/api/upload', { method: 'POST', body: fd });

  }
  const r = await apiJSON('/api/projects/' + S.houseId + '/orders', 'POST', {
    date: val('o-date'), store: val('o-store'), orderNo: val('o-no'), total, receipt,
    lines: lines.map(l => ({ catId: l.catId, itemId: l.itemId, pieces: l.pieces, price: l.price }))
  });
  if (!r) return;
  closeModal(); await load(); openHouse(S.houseId);
  toast('Order saved on ' + r.shares.length + ' line(s)');
}

async function deleteOrder(orderId) {
  if (!confirm('This entry is part of one order split across several lines. Delete the whole order?')) return;
  await api('/api/projects/' + S.houseId + '/orders/' + orderId, { method: 'DELETE' });
  const keep = CUR; PHOTO_PICK = null;
  await load();
  if (keep) openItem(keep.catId, keep.itemId); else openHouse(S.houseId);
}

// ── House plan ───────────────────────────────────────────────
// The plan's door & window schedules, rooms and square footage give most
// of the counts; fixtures drawn only as symbols (lights, fans) are typed in
// until the AI reader is connected. Every number can be corrected by hand.
const SRC_CHIP = {
  plan: '<span class="chip green" title="Read from the plan schedule">plan</span>',
  estimate: '<span class="chip amber" title="Worked out from the rooms — check it">estimate</span>',
  manual: '<span class="chip blue" title="Typed in by hand">by hand</span>'
};

function needGot(item) {
  const got = (item.purchases || []).reduce((s, c) => s + (Number(c.pieces) || 0), 0);
  if (item.needQty == null && !got) return '<span class="muted">—</span>';
  const short = item.needQty != null && got < item.needQty && got > 0;
  return '<span class="num"' + (short ? ' style="color:var(--amber-text)"' : '') + '>' +
    (item.needQty != null ? item.needQty : '?') + ' / ' + got + '</span>' +
    (item.needQty != null && got >= item.needQty ? ' ✓' : '');
}

function planFacts(plan) {
  const r = plan.rooms || {};
  const facts = [];
  if (plan.livingSqft) facts.push(plan.livingSqft.toLocaleString('en-US') + ' sqft living');
  (plan.outdoor || []).forEach(o => facts.push(o.sqft + ' sqft ' + o.name.toLowerCase()));
  if (plan.stoneSqft) facts.push(plan.stoneSqft + ' sqft stone' + (plan.stoneName ? ' (' + plan.stoneName.toLowerCase() + ')' : ''));
  if (r.bedrooms) facts.push(r.bedrooms + ' bedrooms');
  if (r.fullBaths || r.halfBaths) facts.push((r.fullBaths || 0) + ' full / ' + (r.halfBaths || 0) + ' half baths');
  return facts;
}

function planBox(p) {
  const plan = p.plan;
  let html = '<div class="gray-box" style="border-color:var(--blue)">' +
    '<div style="font-weight:700;margin-bottom:8px">📐 House plan</div>' +
    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
      '<input type="file" id="pl-file" accept="application/pdf" style="max-width:320px">' +
      '<button class="btn btn-navy" style="padding:8px 14px" onclick="readPlan()">Read the plan</button>' +
      (plan && plan.fileUrl ? '<a href="' + esc(plan.fileUrl) + '" target="_blank" style="font-size:12.5px">open the one on file</a>' : '') +
    '</div>';
  if (!plan) {
    html += '<div style="font-size:12px;color:var(--gray);margin-top:8px">Upload the "FULL SET OF PLANS" PDF. ' +
      'It counts the windows and doors from the plan schedules, the rooms, and the square footage — ' +
      'then you check the numbers below before saving.</div></div>';
    return html;
  }
  html += '<div class="chips" style="margin-top:10px">' + planFacts(plan).map(f => '<span class="chip">' + esc(f) + '</span>').join('') + '</div>';
  (plan.warnings || []).forEach(w => { html += '<div class="notice red" style="margin:12px 0 0">' + esc(w) + '</div>'; });
  html += '<div class="notice" style="margin:12px 0 10px">Check every number before saving. ' +
    '<b>plan</b> = read from the door/window schedule · <b>estimate</b> = worked out from the rooms · ' +
    'empty = the plan shows it only as a symbol — type it in.</div>';
  html += '<table class="items" id="pl-counts"><tr><th>What</th><th>How many</th><th>Source</th></tr>';
  let lastCat = '';
  S.catalog.planCounts.forEach(pc => {
    if (pc.cat !== lastCat) {
      html += '<tr><td colspan="3" style="background:#f7f9fb;font-weight:700;font-size:12px">' +
        catBase(pc.cat).icon + ' ' + esc(catBase(pc.cat).name) + '</td></tr>';
      lastCat = pc.cat;
    }
    const v = (plan.counts || {})[pc.key];
    html += '<tr><td>' + esc(pc.label) + (pc.hint ? '<div class="i-sel">' + esc(pc.hint) + '</div>' : '') + '</td>' +
      '<td><input type="number" min="0" step="1" style="width:90px" data-k="' + pc.key + '" value="' + (v == null ? '' : v) + '"></td>' +
      '<td>' + (SRC_CHIP[(plan.sources || {})[pc.key]] || '<span class="muted">type it in</span>') + '</td></tr>';
  });
  html += '</table>';
  if (plan.windows) html += '<details style="margin-top:9px;font-size:12.5px"><summary>Window schedule (' + plan.windows.total + ')</summary>' +
    plan.windows.rows.map(w => esc(w.mark) + ' — ' + esc(w.size) + ' ' + esc(w.description) + ' × ' + w.count).join('<br>') + '</details>';
  if (plan.doors) html += '<details style="margin-top:6px;font-size:12.5px"><summary>Door schedule</summary>' +
    plan.doors.rows.map(d => esc(d.mark) + ' — ' + esc(d.size) + (d.pair ? ' pair' : '') + ' ' + esc(d.material) + ' ' + esc(d.comments) +
      ' × ' + d.count + ' <span class="muted">(' + d.kind + ')</span>').join('<br>') + '</details>';
  if (plan.stoneSqft) html += '<div style="margin-top:10px"><button class="btn-sm" onclick="useStoneSqft(' + plan.stoneSqft + ')">' +
    'Use ' + plan.stoneSqft + ' sqft for the exterior stone allowance</button></div>';
  return html + '</div>';
}

async function readPlan() {
  const file = $('pl-file').files[0];
  if (!file) { toast('Pick the plan PDF first'); return; }
  toast('Reading the plan…');
  const fd = new FormData(); fd.append('pdf', file);
  const r = await api('/api/projects/' + S.houseId + '/read-plan', { method: 'POST', body: fd });
  if (!r) return;
  if (!r.plan.found) toast('This plan has no schedules the tool can read — type the numbers in');
  await load(); S.view = 'house'; render(); openAllowances();
  toast('Plan read — check the numbers');
}

function planCountsFromScreen() {
  const counts = {};
  document.querySelectorAll('#pl-counts input[data-k]').forEach(el => { counts[el.dataset.k] = el.value; });
  return counts;
}
async function savePlanCounts(quiet) {
  await apiJSON('/api/projects/' + S.houseId + '/plan', 'PUT', { counts: planCountsFromScreen() });
  if (!quiet) toast('Plan numbers saved');
}

// The stone allowance is priced per sqft "as shown on the blueprint"
function useStoneSqft(sqft) {
  const cat = house().categories.find(c => c.id === 'stone');
  const item = cat && cat.items.find(i => i.type === 'sqft' || DRAFT[i.id].basis === 'sqft') || (cat && cat.items[0]);
  if (!item) return;
  const d = draftOf(item.id);
  if (d.basis === 'category') d.basis = 'sqft';
  d.count = sqft;
  renderSplit('stone');
  toast('Stone sqft filled in — put the $/sqft from the contract');
}

function planCard(p) {
  const plan = p.plan;
  if (!plan) return '<div class="card" style="padding:14px 24px;font-size:13px;color:var(--gray)">📐 No plan read yet — ' +
    '<a href="#" onclick="openAllowances();return false">upload it on the "Set allowances" sheet</a> to get the counts for this house.</div>';
  const c = plan.counts || {};
  const show = S.catalog.planCounts.filter(pc => c[pc.key]);
  return '<div class="card" style="border-left-color:var(--blue)"><div style="padding:14px 24px">' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>📐 From the plan</b>' +
      planFacts(plan).map(f => '<span class="chip">' + esc(f) + '</span>').join('') +
      (plan.confirmed ? '' : '<span class="chip amber">not checked yet</span>') +
      (plan.fileUrl ? '<a href="' + esc(plan.fileUrl) + '" target="_blank" style="font-size:12px;margin-left:auto">plan PDF</a>' : '') + '</div>' +
    '<div class="chips" style="margin-top:8px">' + show.map(pc =>
      '<span class="chip ' + (plan.sources[pc.key] === 'estimate' ? 'amber' : 'blue') + '">' + c[pc.key] + ' ' + esc(pc.label.toLowerCase()) + '</span>').join('') +
    '</div></div></div>';
}

// ── Deliveries ───────────────────────────────────────────────
// Ordered → lands at the office / an owner's house → Robert takes it to the
// garage on his pickup day → delivered to the house. Robert ticks each step
// on his phone at /driver.html; the office sees it all here.
const ROOMS = ['Kitchen', 'Living room', 'Dining', 'Master bedroom', 'Master bath', 'Master closet',
  'Bedroom 2', 'Bedroom 3', 'Bedroom 4', 'Bath 2', 'Bath 3', 'Half bath', 'Laundry', 'Hallway',
  'Entry', 'Garage', 'Porch / Patio', 'Exterior', 'Bedrooms', 'Bathrooms', 'Whole house'];
const STAGE_TXT = { '': 'On the way', arrived: 'Waiting for pickup', garage: 'In garage', delivered: 'Delivered' };

const placeName = id => id === 'garage' ? S.deliveries.garage : id === 'house' ? 'the house'
  : ((S.deliveries.places.find(p => p.id === id) || {}).name || id);

function deliveryBox(item) {
  if (!['ordered', 'in-transit', 'received', 'installed'].includes(item.status)) return '';
  const d = item.delivery || {};
  CUR.dstage = d.stage || ''; CUR.dloc = d.stage === 'arrived' ? (d.location || '') : '';
  const cur = (d.stage || '') + ':' + CUR.dloc;
  const opts = [[':', 'On the way — not here yet']]
    .concat(S.deliveries.places.map(p => ['arrived:' + p.id, 'Arrived at ' + p.name]))
    .concat([['garage:', 'In ' + S.deliveries.garage], ['delivered:', 'Delivered to the house']]);
  const last = (d.log || []).slice(-1)[0];
  return '<div class="field"><label>Where is it now</label><select id="f-dstage">' +
    opts.map(([v, t]) => '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
    '</select>' + (last && last.by ? '<div class="muted" style="font-size:12px;margin-top:5px">Last moved ' +
      new Date(last.at).toLocaleDateString() + ' by ' + esc(last.by) + '</div>' : '') + '</div>';
}

// What should worry the office: needed at the house now but not there yet
function deliveryWarnings() {
  return (S.deliveries ? S.deliveries.items : []).filter(i =>
    i.stage !== 'delivered' && (i.need === 'critical' || i.need === 'urgent'));
}

function viewDeliveries() {
  const D = S.deliveries;
  const items = D.items;
  const count = st => items.filter(i => i.stage === st).length;
  const driverLink = location.origin + '/driver.html';
  const warn = deliveryWarnings();
  let html = '<div class="dash">' +
    card('Waiting for pickup', count('arrived'), 'At the office / owners\' houses', count('arrived') ? 'c-amber' : 'c-green') +
    card('In ' + D.garage, count('garage'), 'Ready to take to the houses', 'c-blue') +
    card('On the way', count(''), 'Ordered, not arrived', 'c-blue') +
    card('Needed now, not delivered', warn.length, 'The house is at that phase', warn.length ? 'c-red' : 'c-green') +
    '</div>';

  html += '<div class="notice blue">Robert\'s page for his phone: <b>' + esc(driverLink) + '</b> ' +
    '<button class="btn-sm" onclick="navigator.clipboard.writeText(\'' + esc(driverLink) + '\');toast(\'Link copied\')">Copy link</button> ' +
    '<a class="btn-sm" style="text-decoration:none" href="/driver.html" target="_blank">Open it</a><br>' +
    '<span style="font-size:12px">Only what Robert carries shows here: cabinet &amp; countertop hardware, inside door hardware, plumbing, light fixtures and mirrors — the vendors deliver the rest. He signs in with the same access key. English / Español button at the top.' +
    (D.pickupDay ? ' Pickup day: <b>' + esc(D.pickupDay) + '</b>.' : ' Set his pickup day under Settings.') + '</span></div>';

  if (warn.length) {
    html += '<div class="section-title">Needed at the house — not delivered yet</div><div class="card n-critical">' +
      warn.map(i => '<div class="alert" onclick="openHouse(\'' + i.houseId + '\')"><div class="alert-icon">' +
        (i.need === 'critical' ? '🚨' : '⚠️') + '</div><div class="alert-body"><div class="alert-title">' +
        esc(i.house) + ' — ' + esc(i.item) + (i.room ? ' <span class="chip blue">' + esc(i.room) + '</span>' : '') + '</div>' +
        '<div class="alert-detail">' + esc(STAGE_TXT[i.stage]) + (i.stage === 'arrived' ? ' at ' + esc(placeName(i.location)) : '') +
        ' · ' + (i.need === 'critical' ? 'the house is at this phase now' : 'the house reaches this phase next') +
        '</div></div></div>').join('') + '</div>';
  }

  const houses = {};
  items.forEach(i => (houses[i.houseId] = houses[i.houseId] || []).push(i));
  html += '<div class="section-title">By house</div>';
  if (!items.length) html += '<div class="empty"><div class="em">🚚</div>Nothing has been ordered yet. ' +
    'Items show up here once they are marked as ordered.</div>';
  Object.values(houses).forEach(list => {
    const h = list[0];
    const cols = ['', 'arrived', 'garage', 'delivered'];
    html += '<div class="card"><div class="house-head" style="cursor:default"><div><div class="house-name">' + esc(h.house) + '</div>' +
      '<div class="house-addr">' + esc(h.address) + '</div></div>' +
      '<div class="house-nums">' + cols.map(c => '<div class="house-num"><div class="t">' + STAGE_TXT[c] +
        '</div><div class="v">' + list.filter(i => i.stage === c).length + '</div></div>').join('') +
      '<div><button class="btn-sm" onclick="printLabels(\'' + h.houseId + '\')">🏷 Print labels</button></div></div></div>' +
      '<table class="items"><tr><th>Item</th><th>Room</th><th>Where it is</th><th>Last move</th></tr>' +
      list.map(i => {
        const last = (i.log || []).slice(-1)[0];
        return '<tr class="row" onclick="S.houseId=\'' + i.houseId + '\';openItem(\'' + i.catId + '\',\'' + i.itemId + '\')">' +
          '<td><div class="i-name">' + i.icon + ' ' + esc(i.item) + '</div><div class="i-sel">' + esc(i.category) + '</div></td>' +
          '<td>' + (i.room ? esc(i.room) : '<span class="muted">—</span>') + '</td>' +
          '<td><span class="chip ' + ({ '': 'gray', arrived: 'amber', garage: 'blue', delivered: 'green' })[i.stage] + '">' +
            esc(STAGE_TXT[i.stage]) + (i.stage === 'arrived' ? ' · ' + esc(placeName(i.location)) : '') + '</span></td>' +
          '<td class="muted" style="font-size:12px">' + (last ? new Date(last.at).toLocaleDateString() + (last.by ? ' · ' + esc(last.by) : '') : '—') + '</td></tr>';
      }).join('') + '</table></div>';
  });
  return html;
}

// One label per box: house, address, room, what it is — tape it on when it lands
function printLabels(houseId) {
  const list = S.deliveries.items.filter(i => i.houseId === houseId && i.stage !== 'delivered');
  if (!list.length) { toast('Nothing left to deliver for this house'); return; }
  const labels = [];
  list.forEach(i => {
    const of = Math.max(1, Number(i.pieces) || 1);
    for (let n = 1; n <= of; n++) labels.push({ i, n, of });
  });
  const w = window.open('', '_blank');
  w.document.write('<!DOCTYPE html><html><head><title>Labels — ' + esc(list[0].house) + '</title><style>' +
    'body{font-family:Arial,sans-serif;margin:0;padding:10mm}' +
    '.grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm}' +
    '.l{border:2px solid #000;border-radius:3mm;padding:4mm;page-break-inside:avoid;height:58mm;box-sizing:border-box}' +
    '.h{font-size:22pt;font-weight:bold;text-transform:uppercase}.a{font-size:10pt;color:#444}' +
    '.r{font-size:17pt;font-weight:bold;margin-top:3mm;background:#000;color:#fff;padding:1mm 3mm;display:inline-block}' +
    '.it{font-size:12pt;margin-top:2mm}.n{font-size:10pt;color:#444;margin-top:1mm}' +
    '</style></head><body><div class="grid">' +
    labels.map(({ i, n, of }) => '<div class="l"><div class="h">' + esc(i.house) + '</div><div class="a">' + esc(i.address) + '</div>' +
      '<div class="r">' + esc(i.room || 'Room: ________') + '</div>' +
      '<div class="it"><b>' + esc(i.item) + '</b> · ' + esc(i.category) + '</div>' +
      '<div class="n">' + (of > 1 ? 'Box ' + n + ' of ' + of + ' · ' : '') + (i.orderNo ? 'Order ' + esc(i.orderNo) : '') + '</div></div>').join('') +
    '</div><script>window.onload=()=>window.print()<\/script></body></html>');
  w.document.close();
}

function openSettings() {
  modal('Settings',
    '<div class="field"><label>Warn when a category reaches this % of its allowance</label>' +
      '<input type="number" id="cf-warn" value="' + (S.data.config.warnPercent || 80) + '" min="1" max="100"></div>' +
    '<div class="field"><label>Change the access key (leave blank to keep it)</label>' +
      '<input type="password" id="cf-key" placeholder="At least 4 characters"></div>' +
    '<div class="section-title" style="margin-top:6px">Deliveries</div>' +
    '<div class="field"><label>Where packages land before pickup (one per line)</label>' +
      '<textarea id="cf-places">' + esc(S.deliveries.places.map(p => p.name).join('\n')) + '</textarea></div>' +
    '<div class="row2"><div class="field"><label>Where Robert stores them</label>' +
      '<input type="text" id="cf-garage" value="' + esc(S.deliveries.garage) + '"></div>' +
      '<div class="field"><label>Pickup day</label><select id="cf-day">' +
      ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map(d =>
        '<option value="' + d + '"' + (S.deliveries.pickupDay === d ? ' selected' : '') + '>' + (d || '— not set —') + '</option>').join('') +
      '</select></div></div>' +
    '<div class="notice blue">Construction phases come from the scheduling board. Each house is matched by its number ' +
      '(for example 113) and family name; press <b>Sync phases</b> to update all of them (' + S.reports.length + ' houses on the board).</div>' +
    '<div class="set-sec"><h4>Contract reader (this computer only)</h4>' +
      '<div class="field"><label>Contract key</label><input type="password" id="cf-ct-token" placeholder="' + (contractConfig().token ? 'saved — type to replace' : 'paste the key from Supabase') + '"></div>' +
      '<div class="field"><label>Reader address</label><input type="text" id="cf-ct-url" value="' + esc(contractConfig().url) + '"></div>' +
      '<button class="btn-sm" onclick="saveContractReader()">Save the contract reader</button>' +
      '<div id="ct-saved" style="font-size:12.5px;margin-top:8px">' + (contractConfig().token ? '✅ A contract key is saved on this computer.' : 'No contract key saved on this computer yet.') + '</div></div>' +
    '<div class="set-sec"><h4>Backup</h4>' +
      '<button class="btn-sm" onclick="downloadOrdersBackup()">Download a backup file</button></div>' +
    '<div class="set-sec"><h4>Bring over the old desktop tool</h4>' +
      '<div class="notice blue">One time only. Choose the old <b>STB-Ordenes</b> folder; its houses, allowances, orders and photos are copied to the cloud. ' +
      'Houses already here are skipped, unless you tick the box below.</div>' +
      '<input type="file" id="imp-folder" webkitdirectory multiple>' +
      '<label style="display:block;margin-top:10px;font-size:13px"><input type="checkbox" id="imp-replace"> Replace the houses that are already here with the ones in the folder ' +
        '<span class="muted">(a backup file downloads first)</span></label>' +
      '<div style="margin-top:10px"><button class="btn-sm" id="imp-btn" onclick="runImport()">Import from the folder</button></div>' +
      '<div id="imp-status"></div></div>',
    '<button class="btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-navy" onclick="saveSettings()">Save</button>');
}
async function runImport() {
  const input = $('imp-folder');
  if (!input.files.length) { toast('Choose the folder first'); return; }
  const replace = !!($('imp-replace') && $('imp-replace').checked);
  if (replace && !confirm('Houses that are already here will be REPLACED by the ones in the folder. A backup file downloads first. Continue?')) return;
  const st = $('imp-status'); $('imp-btn').disabled = true; st.textContent = 'Reading the folder…';
  try {
    if (replace) await downloadOrdersBackup();
    const r = await importOldTool(input.files, (d, t) => { st.textContent = 'Copying photos… ' + d + ' of ' + t; }, replace);
    st.innerHTML = '✅ <b>' + r.added + '</b> house(s) added' + (r.replaced ? ' · <b>' + r.replaced + '</b> replaced' : '') + (r.skipped ? ' · ' + r.skipped + ' already here' : '') +
      ' · ' + r.uploaded + ' files copied' + (r.missing ? ' · ' + r.missing + ' file(s) were not in the folder' : '');
    try { await upgradeIfNeeded(); } catch (e) {}
    await load(); toast('Import finished');
  } catch (e) { st.textContent = '⚠ ' + (e.message || e); }
  finally { $('imp-btn').disabled = false; }
}
async function sendCO(coId) {
  if (!confirm('Send this change order to STB Cobros? It will show up there ready to be signed and billed.')) return;
  try {
    await apiJSON('/api/projects/' + S.houseId + '/change-orders/' + coId + '/send-to-cobros', 'POST', {});
    await load(); openHouse(S.houseId); toast('Sent to Cobros');
  } catch (_) { /* the message already showed */ }
}
// Kept on this computer only (never in the cloud). Checked by reading it back, so a blocked browser shows a clear message.
function saveContractReader() {
  const tok = (val('cf-ct-token') || '').trim(), url = (val('cf-ct-url') || '').trim();
  try {
    if (tok) localStorage.setItem(CONTRACT_TOKEN_LS, tok);
    if (url) localStorage.setItem(CONTRACT_URL_LS, url);
    const back = contractConfig();
    if ((tok && back.token !== tok) || (url && back.url !== url)) throw new Error('read-back mismatch');
  } catch (e) {
    const el = $('ct-saved'); if (el) el.innerHTML = '⚠ This browser would not keep the setting (private window or blocked site data). Use a normal Chrome window.';
    toast('Could not save the contract reader on this computer'); return false;
  }
  const el = $('ct-saved'); if (el) el.innerHTML = '✅ Saved on this computer. A contract key is ' + (contractConfig().token ? 'saved.' : 'NOT saved yet.');
  toast('Contract reader saved on this computer');
  testReaderKey().then(r => { const e2 = $('ct-saved'); if (e2) e2.innerHTML = r === 'bad' ? '⚠ Saved, but the reader did NOT accept this key. Check 0 (zero) vs O, and l / 1 / I.' : r === 'ok' ? '✅ Saved, and the reader accepted the key.' : '✅ Saved (could not reach the reader to check it right now).'; });
  return true;
}

async function saveSettings() {
  if ((val('cf-ct-token') || '').trim() || (val('cf-ct-url') || '').trim()) saveContractReader();   // first, so it never depends on the cloud save
  const body = { warnPercent: val('cf-warn'), garageName: val('cf-garage'), pickupDay: val('cf-day'),
                 pickupPlaces: val('cf-places').split('\n') };
  if (val('cf-key')) body.key = val('cf-key');
  await apiJSON('/api/config', 'POST', body);
  closeModal(); await load(); toast('Settings saved');
}

bootOrders();
